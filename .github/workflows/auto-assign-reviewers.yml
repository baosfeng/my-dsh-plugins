# 自动分配 Reviewer 工作流
# 根据文件类型和 PR 类型自动分配 reviewer

name: Auto Assign Reviewers

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/*.yml
            package.json
            tsconfig*.json
            eslint.config.js
            **/test/**
            **/*.md
            plugins/**/src/**
            plugins/dsh-shared/**

      - name: Assign reviewers based on file types
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const reviewers = new Set();
            const focusAreas = new Set();

            // 检查文件类型并分配 reviewer
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ');

            for (const file of changedFiles) {
              // CI/CD 配置
              if (file.startsWith('.github/workflows/')) {
                reviewers.add('baosfeng');
                focusAreas.add('CI/CD 配置安全性');
                focusAreas.add('性能优化');
              }
              
              // 依赖配置
              if (file === 'package.json') {
                reviewers.add('baosfeng');
                focusAreas.add('依赖安全性');
                focusAreas.add('版本兼容性');
              }
              
              // TypeScript 配置
              if (file.startsWith('tsconfig')) {
                reviewers.add('baosfeng');
                focusAreas.add('TypeScript 配置最佳实践');
              }
              
              // ESLint 配置
              if (file === 'eslint.config.js') {
                reviewers.add('baosfeng');
                focusAreas.add('代码质量规则');
              }
              
              // 测试文件
              if (file.includes('/test/')) {
                reviewers.add('baosfeng');
                focusAreas.add('测试覆盖率');
                focusAreas.add('测试质量');
              }
              
              // 文档文件
              if (file.endsWith('.md')) {
                reviewers.add('baosfeng');
                focusAreas.add('文档完整性');
              }
              
              // 插件代码
              if (file.startsWith('plugins/') && file.includes('/src/')) {
                reviewers.add('baosfeng');
                focusAreas.add('代码架构');
                focusAreas.add('性能优化');
              }
              
              // 共享库代码
              if (file.startsWith('plugins/dsh-shared/')) {
                reviewers.add('baosfeng');
                focusAreas.add('API 设计');
                focusAreas.add('向后兼容性');
              }
            }

            // 分配 reviewer（issue #304）
            // 旧写法把候选集合原样丢给 requestReviewers，而候选里就含 PR 作者本人
            // （个人仓库的 PR 作者恒为本人）→ GitHub 返回 422
            // "Review cannot be requested from pull request author"（run 34969856346），
            // 整个 job 必然失败、自动指派从未生效。现在改为：
            //   过滤 PR 作者 → 无可用对象时优雅跳过（打 notice，不失败）→
            //   其余异常降级为 warning（自动指派是辅助能力，不该给 PR 挂假红灯）。
            const prAuthor = context.payload.pull_request?.user?.login ?? '';
            try {
              const { pathToFileURL } = await import('node:url');
              const { resolveReviewers, describeAssignment } = await import(
                pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/reviewer-assignment.mjs`).href
              );

              const plan = resolveReviewers({ candidateReviewers: Array.from(reviewers), prAuthor });
              core.info(describeAssignment(plan, prAuthor));

              if (plan.eligible.length === 0) {
                core.notice(`自动指派已跳过（job 仍成功）：${plan.skipReason === 'only-pr-author' ? '唯一候选是 PR 作者本人，GitHub 不允许请求自审' : '本次改动没有命中任何候选账号'}`);
              } else {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  reviewers: plan.eligible
                });
                core.info(`已请求 review：${plan.eligible.join(', ')}`);
              }
            } catch (error) {
              core.warning(`自动指派未完成（降级为警告，job 仍成功）：${error.message}`);
            }

            // 添加审查焦点评论
            if (focusAreas.size > 0) {
              const focusList = Array.from(focusAreas).map(area => `- ${area}`).join('\n');
              const body = `## 🔍 审查焦点\n\n本次 PR 涉及以下方面，请重点关注：\n\n${focusList}`;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
