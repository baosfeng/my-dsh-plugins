name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 手动触发：偶发测试超时/环境问题导致 CI 红时，Actions → CI → Run workflow 重跑
  workflow_dispatch:

# 最小权限：CI 只读仓库内容，不需要写 GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # 质量门禁：依赖漏洞审计（issue #16 建议点 2）
  # 高/严重漏洞即阻断（本地 npmmirror 不支持 audit API，CI 默认官方 registry 可用）
  # 独立 job：与测试/质量检查并行，不阻塞主流程
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # 缓存 npm 缓存目录（key 基于 package-lock.json hash），加速 npm ci

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: Audit dependencies (npm audit, high+ blocks)
        run: npm audit --audit-level=high

  # 质量门禁：单元测试 + 覆盖率（行≥85 / 分支≥75，低于阈值即失败）
  # matrix 并行：每个插件一个独立 job，墙钟时间 ≈ 单个插件测试时长
  # 新增插件时在此列表追加（check-docs.mjs 会强制提醒文档同步）
  # 注意：dsh-shared 此前漏登记（它有完整测试却从不在 CI 跑），已补入
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 一个插件失败不取消其他插件的测试
      matrix:
        plugin:
          - dsh-file-activity
          - dsh-think-zh-expand
          - dsh-mermaid-render
          - dsh-md-render
          - dsh-my-guardian
          - dsh-my-memory
          - dsh-my-notify
          - dsh-my-observability
          - dsh-my-guard
          - dsh-my-context
          - dsh-my-plugin-manager
          - dsh-my-skill-manager
          - dsh-plugin-dev-mode
          - dsh-task-reliability
          - dsh-ts-example
          - dsh-my-remote
          - dsh-session-title-gen
          - dsh-my-opencode-session-header
          - dsh-shared
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          for f in lib/index.js lib/client.js; do
            if [ -f "plugins/${{ matrix.plugin }}/$f" ]; then
              node --check "plugins/${{ matrix.plugin }}/$f"
            fi
          done

      - name: Test ${{ matrix.plugin }} (unit tests + coverage gates)
        run: (cd "plugins/${{ matrix.plugin }}" && npm test)

  # 质量门禁：资源冒烟（issue #127 插件资源占用防护）
  # 长会话资源回归检查：模拟「高频工具调用 + 多子 agent + 数小时」的生产形态
  # （补充 #126 长会话测试盲区），断言审计存储：
  #   1. 写放大 ≤1.6（增量追加，不是每次全量重写——9/2 磁盘风暴根因）；
  #   2. 内存有界（每会话/全局事件上限生效，不随事件数线性增长）；
  #   3. 降级路径（资源看门狗：停落盘 → 恢复全量快照补齐，不丢不重）。
  # 独立 job 与 test 并行，不拉长主流程墙钟。脚本：scripts/resource-smoke.mjs
  resource-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: Resource smoke (long-session write amplification + degrade)
        run: node scripts/resource-smoke.mjs

  # 质量门禁：变异测试（issue #13 试点：dsh-file-activity）
  # 本地实测 20s（90.91% 变异分 ≥ break 70）；独立 job 与测试并行
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: 'Mutation testing (stryker pilot: dsh-file-activity)'
        run: (cd plugins/dsh-file-activity && npx stryker run)

  # 质量门禁：代码质量规则 + 尺寸规则 + 依赖结构 + 文档一致性
  # 三者都很快（秒级），合并一个 job 与测试并行
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      # 类型检查（issue #47：TS 插件开发——tsc --noEmit 编译期发现模块
      # 不存在 TS2307 / 类型不匹配 / 未定义变量；TS 7 原生编译器）
      # 根配置 exclude plugins/*/src/client/**：client parts 是拼接片段
      # （无 import/export，靠 factory 全局作用域共享符号），在根配置的
      # nodenext 模块模式下会被当成独立模块而全量报错（TS2304/TS2552）。
      # client 端类型检查由下一步按插件跑 tsconfig.client.json 承担。
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      # 逐插件类型检查（server 端 tsconfig.json + client 端 tsconfig.client.json）
      - name: Type check (per-plugin server + client)
        run: bash scripts/typecheck-all.sh

      # 代码质量规则 + 尺寸规则（complexity≤10 / 函数≤70行 / 文件≤400行，
      # issue #44 引入 prettier 后调整，见 eslint.config.js 注释）。
      # 覆盖范围：TS 全量迁移后插件源码是 plugins/*/src/**/*.ts，而 flat config
      # 没有 .ts 块（typescript-eslint 尚不兼容 TS 7），本步骤实际只覆盖手写 JS
      # （lib/parts 片段、client.src.js 模板）；TS 源码尺寸门禁由下一步承担。
      - name: Lint (quality rules + size gates)
        run: npx eslint plugins/

      # TS 源码尺寸门禁（TS 全量迁移引入的门禁漏洞：flat config 无 .ts 块，
      # src/**/*.ts 全部逃过复杂度/行数检查——迁移前刻意压在 400 行的文件加类型
      # 注解后超标却无人发现）。scripts/check-ts-size.mjs 用 @babel/parser 解析
      # TS AST，按 ESLint max-lines / max-lines-per-function / complexity 的真实
      # 语义重新施加门禁；迁移引入的存量超标项由 scripts/ts-size-baseline.json
      # 冻结债务基线放行（只允许变好，基线外新增或超过基线值即失败），
      # 收口后用 node scripts/check-ts-size.mjs --update-baseline 刷新。
      - name: TS source size gates (check-ts-size)
        run: npm run lint:size

      # 格式校验（issue #44：prettier 统一全仓格式，CI 强制 prettier --check；
      # 构建产物 client.js / vendor 压缩产物在 .prettierignore 排除）
      - name: Format check (prettier)
        run: npx prettier --check .

      # 发版校验纯函数单元测试（issue #39：跨插件依赖校验逻辑，含覆盖率门禁）
      - name: Release checks unit tests
        run: npm run test:scripts

      # 依赖结构分析（无循环依赖、server/client 不交叉）
      - name: Dependency analysis
        run: npx depcruise plugins/

      # 死代码检测（issue #45：knip 接入 CI——未使用的文件/依赖/导出；
      # 配置见 knip.json：各插件 workspace 入口 + 构建产物/脚本 ignore）
      - name: Dead code check (knip)
        run: npx knip

      # 重复代码检测（issue #45：jscpd 接入 CI——复制粘贴检测；
      # 配置见 .jscpd.json：min-tokens 100 + 配置模板 ignore + 阈值 5%，
      # 真实重复已抽取到 dsh-shared 共享包）
      - name: Duplicate code check (jscpd)
        run: npx jscpd

      # 文档一致性（新插件/新版本必须同步根 README / AGENTS.md /
      # docs/ 索引与模块文档 / 安装章节 npm 方式——防"插件没部署/文档没更新"复发）
      - name: Docs consistency check
        run: node scripts/check-docs.mjs
