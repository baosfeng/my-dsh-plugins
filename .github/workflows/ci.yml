name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 手动触发：偶发测试超时/环境问题导致 CI 红时，Actions → CI → Run workflow 重跑
  workflow_dispatch:

# 最小权限：CI 只读仓库内容，不需要写 GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # 质量门禁：依赖漏洞审计（issue #16 建议点 2）
  # 高/严重漏洞即阻断（本地 npmmirror 不支持 audit API，CI 默认官方 registry 可用）
  # 独立 job：与测试/质量检查并行，不阻塞主流程
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm # 缓存 npm 缓存目录（key 基于 package-lock.json hash），加速 npm ci

      # ── 为什么这里不再 npm ci（issue #240）──────────────────────────────────
      # npm audit 只读 package-lock.json + registry 的 advisories API，**不需要 node_modules**。
      # 实测一个 test matrix job：总 23.1s 里 npm ci 占 13.4s、真正的插件测试只有 2.5s；
      # audit job 原先同样白付一次 npm ci。删掉它不改变门禁语义（审计照跑），只是不再装包。
      # 注意：test job 的 npm ci **不能删**（理由见那一步上方的注释）。

      # ── 为什么显式钉住官方 registry（issue #199）────────────────────────────
      # npm audit 依赖 registry 的 security advisories API（POST /-/npm/v1/security/advisories/bulk）。
      # npmmirror 等镜像不实现该端点（404 [NOT_IMPLEMENTED]），而 runner 的 registry 可能被
      # 环境变量/npmrc 指向镜像 —— 那样 audit 只会以 "audit endpoint returned an error" 失败，
      # 门禁形同虚设。两个变量缺一不可：npm 的 replace-registry-host=npmjs 默认值会把
      # registry.npmjs.org 的请求**重写回当前的镜像 registry**，所以必须显式设 never。
      # ── 为什么是 moderate 而不是默认的 high（issue #199 的核心修复）───────────
      # 原设置 --audit-level=high 会放行 moderate：qs 的两条 moderate 公告
      # （GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g，经 @stryker-mutator/core →
      # typed-rest-client → qs 传入）在 CI 里只打印不阻断，长期无人处理。
      # 与本地 verify-local 保持一致（scripts/verify-local.mjs 的 audit 检查项同级别）。
      - name: Audit dependencies (npm audit, moderate+ blocks, official registry)
        run: npm audit --audit-level=moderate
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_replace_registry_host: never

  # 质量门禁：单元测试 + 覆盖率（行≥85 / 分支≥75，低于阈值即失败）
  # matrix 并行：每个插件一个独立 job，墙钟时间 ≈ 单个插件测试时长
  # 新增插件时在此列表追加（check-docs.mjs 会强制提醒文档同步）
  # 注意：dsh-shared 此前漏登记（它有完整测试却从不在 CI 跑），已补入
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 一个插件失败不取消其他插件的测试
      matrix:
        plugin:
          - dsh-file-activity
          - dsh-think-zh-expand
          - dsh-mermaid-render
          - dsh-md-render
          - dsh-my-guardian
          - dsh-my-memory
          - dsh-my-notify
          - dsh-my-observability
          - dsh-my-guard
          - dsh-my-context
          - dsh-my-plugin-manager
          - dsh-my-skill-manager
          - dsh-plugin-dev-mode
          - dsh-task-reliability
          - dsh-ts-example
          - dsh-my-remote
          - dsh-session-title-gen
          - dsh-my-opencode-session-header
          - dsh-shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      # issue #240 判定：这一步**不能删**。插件的 test 脚本是
      # `npx vitest run --coverage && cucumber-js test/features ...`，而 CI 里
      # plugins/<name>/ 没有自己的 node_modules —— vitest / @vitest/coverage-v8 / cucumber
      # 全靠根这一份解析。实测 dsh-shared job：总 23.1s = npm ci 13.4s + setup-node 5.7s +
      # 真正的测试 2.5s；这个比例值得知道，但删掉它门禁直接没法跑。
      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          for f in lib/index.js lib/client.js; do
            if [ -f "plugins/${{ matrix.plugin }}/$f" ]; then
              node --check "plugins/${{ matrix.plugin }}/$f"
            fi
          done

      - name: Test ${{ matrix.plugin }} (unit tests + coverage gates)
        run: (cd "plugins/${{ matrix.plugin }}" && npm test)

      # 上传单个插件覆盖率到 Coveralls（parallel 模式：每个 matrix job 上传后
      # 由 coverage-finish job 发送 webhook 信号，Coveralls 才汇总并显示总覆盖率）
      #
      # ── continue-on-error：上报失败不得判红（issue #350）──────────────────────
      # Coveralls 是**第三方上报**动作，运行时下载二进制并校验 checksum。#349 实测：job 内插件
      # 测试全绿（Test Files 17 passed / 17 scenarios passed）却仅因
      # `Failed to download coveralls binary or checksum (Linux).` 把 test (dsh-my-notify)
      # 判红 → 一次无谓的 CI 往返（排队 + 19 插件 matrix + 读日志 + 重跑），且**与改动无关**；
      # 本地既无法预知、也无法拦住，属规范第十四节「本地无、CI 有」的第三种漏网形态。
      #
      # ⚠️ 边界：**覆盖率阈值门禁**由各插件自己的 vitest coverage 强制（行 ≥85 / 分支 ≥75 /
      # 函数 ≥80，见根 vitest.config.mjs），那一步（`npm test`）**仍然阻断**；本步骤只是把
      # 已算出的结果**上报**到第三方看板，所以定位是「尽力而为」，不该决定 PR 红绿。
      # 失败仍可在 run 日志与 job annotation 里看到，只是不再判红。反向也由门禁守住：
      # scripts/check-gate-parity.mjs 校验本步骤必须带 continue-on-error，去掉即红。
      - name: Upload coverage to Coveralls
        if: success() && matrix.plugin != 'dsh-plugin-dev-mode'
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          flag-name: ${{ matrix.plugin }}
          parallel: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Coveralls parallel 模式汇总：所有 test matrix job 上传后发送 webhook 信号
  coverage-finish:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 同上（issue #350）：汇总信号同样是第三方上报动作，下载/上报抖动不得判红。注意它
      # `needs: test` —— 测试或覆盖率阈值红时 test job 仍然红，PR 依然拦得住；本步骤只发信号。
      - name: Coveralls finished
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true

  # 质量门禁：资源冒烟（issue #127 插件资源占用防护）
  # 长会话资源回归检查：模拟「高频工具调用 + 多子 agent + 数小时」的生产形态
  # （补充 #126 长会话测试盲区），断言审计存储：
  #   1. 写放大 ≤1.6（增量追加，不是每次全量重写——9/2 磁盘风暴根因）；
  #   2. 内存有界（每会话/全局事件上限生效，不随事件数线性增长）；
  #   3. 降级路径（资源看门狗：停落盘 → 恢复全量快照补齐，不丢不重）。
  # 独立 job 与 test 并行，不拉长主流程墙钟。脚本：scripts/resource-smoke.mjs
  resource-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: Resource smoke (long-session write amplification + degrade)
        run: node scripts/resource-smoke.mjs

  # 质量门禁：变异测试（issue #13 试点：dsh-file-activity）
  # 本地实测 20s（90.91% 变异分 ≥ break 70）；独立 job 与测试并行
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: 'Mutation testing (stryker pilot: dsh-file-activity)'
        run: (cd plugins/dsh-file-activity && npx stryker run)

  # 历史相关门禁（issue #324）：secret 扫描（gitleaks）+ 提交信息规范（commitlint）。
  #
  # 为什么单独一个 job：这两项都要**完整历史** —— gitleaks 要扫全历史（覆盖本次 diff），
  # commitlint 要解析 base..head 两个**历史** SHA；而其余 job 的 checkout 是浅克隆
  # （默认 fetch-depth: 1，两个 SHA 都不在本地，实测只会得到
  # `fatal: Invalid revision range A..B`）。所以这里显式 fetch-depth: 0。
  #
  # 两项的「唯一权威执行点」与本地对应项登记在 scripts/lib/gate-registry.mjs，
  # 由 gate-parity 门禁做双向交叉校验。
  history-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      # 必须装一次根工具链：check-commit-messages.mjs 用 @commitlint/load + @commitlint/lint
      # 解析 .commitlintrc.json（与本地 hook 同一份规则）。secret 扫描本身不需要 node_modules
      # （纯 Node 内置 + 系统 tar），但两个门禁共用一个 job，装一次即可。
      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      - name: Secret scan (gitleaks, pinned version + SHA256, full history)
        run: node scripts/check-secrets.mjs

      # 范围：CI 上从 GITHUB_EVENT_PATH 推导（PR = base..head；push = before..after），
      # 本地等价命令 `npm run lint:commits -- --from origin/main --to HEAD`。
      - name: Commit messages (changed range only)
        run: node scripts/check-commit-messages.mjs

  # 质量门禁：类型检查 + 代码质量规则 + 尺寸规则 + 依赖结构 + 死代码 + 重复代码 + 文档一致性
  #
  # issue #330：改前这里是 12 个**串行**步骤，每一步都独立启动 npx、独立全仓扫描，彼此无依赖
  # 却排队（本机实测纯累加 41.7s；且同一批 server TS 被 tsc 检查 3 遍、prettier 被跑 3 遍）。
  # 现在合并为**一个并发执行体**：`verify-local --ci-quality`（插件测试/资源冒烟/审计/变异各由
  # 独立 job 覆盖，不在本 job 重复）。检查项清单与「唯一权威执行点」登记在
  # scripts/lib/gate-registry.mjs，由 `gate-parity` 门禁对本文件、verify-local、登记表做**双向**
  # 交叉校验（声明了没跑 / 跑了没声明，都会红，缺口逐条列出）。
  #
  # 失败可定位性（并发化的硬约束）：虽然 Actions UI 里只剩一个步骤，但
  #   ① 每一项的完整输出在日志里按 `[verify] ❌ <label>` 分组打印（不是「某步失败」了事）；
  #   ② 结果表写进 job summary（哪一项红 + 每项耗时 + 复现命令）；
  #   ③ 单项复现：`node scripts/verify-local.mjs --only <id>`。
  #
  # 并发度 4（runner 是 4 核，这批检查项都是单线程 Node 进程；实测再高无收益，见
  # scripts/verify-local.mjs 的 checkConcurrency 注释）。整体墙钟由最慢的一项决定。
  quality:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是**必需的**（issue #324）：本 job 里的 commitlint 只校验变更范围，
      # 而它要解析 `base.sha..head.sha` 两个**历史** SHA —— 默认 fetch-depth: 1 的浅克隆里
      # 两者都不存在，git 只会回 `fatal: Invalid revision range A..B`（首个 CI 运行实测）。
      # 代价：拉全历史约 +3s；换来的是"范围判定在本地/CI 用同一套语义"。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install root toolchain (eslint, dependency-cruiser)
        run: npm ci

      # 执行体：scripts/verify-local.mjs --ci-quality。
      # 覆盖（每项的权威执行点见 scripts/lib/gate-registry.mjs）：
      #   根 tsc --noEmit / 逐插件 server+client tsc（scripts/typecheck-all.mjs，并发）
      #   / eslint（complexity≤10、函数≤70 行、文件≤400 行、import 解析）
      #   / TS 源码尺寸门禁（check-ts-size）/ 客户端 bundle 模块白名单（check-client-modules）
      #   / 客户端产物体积预算（check-client-size，issue #322）/ 包发布卫生（check-pack-hygiene，issue #323）
      #   / prettier --check / 发版校验单测（test:scripts）/ dependency-cruiser / knip / jscpd
      #   / check-docs / check-links / check-gate-parity（本地↔CI 覆盖一致性）
      #   / 固定 sleep 门禁（check-test-sleeps，issue #335）
      #   / 产物一致性（issue #318，ADR-0002）：共享部件 `plugins/dsh-shared/client-parts/*` 是
      #     纯函数文本片段，构建期 splice 进消费方的 lib/client.js；server 端 lib/*.js 是 tsc
      #     产物。两者都必须提交，而 CI 不跑构建 → 漏重建会静默陈旧（实测 commit 735e2fa 加图标
      #     只重建 2 个消费方；file-activity 的 media-route.js / store.js 也陈旧）。
      #     check-client-artifacts.mjs 重建后与已提交产物逐字节比对，fail-closed。
      - name: Quality gates (concurrent, registry-driven)
        run: node scripts/verify-local.mjs --ci-quality
