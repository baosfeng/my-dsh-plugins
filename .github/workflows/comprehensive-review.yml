# 全面自动审查工作流（本仓库唯一的 PR 自动审查 workflow，issue #303）
# 从多个角度自动审查 PR，提供详细的审查报告。
# 去重说明：原 auto-code-review.yml 的 5 个 job（code-quality/security-review/performance-review/
# test-review/documentation-review）是本文件 7 个 job 的真子集，两者监听同一事件导致每次 push
# 发两套报告（#295 累计 36 条 bot 评论），故删除 auto-code-review.yml，只保留本文件。
# 每个 job 发一条 sticky 评论（marker 去重，push 时 update 而非 append），
# 评论正文经 .github/scripts/review-comment.cjs 剥色，避免 ANSI 乱码。

name: Comprehensive Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# issue #303：CI runner 上 npm/prettier 等命令输出带 ANSI 颜色（实测日志中的 \u001b[36;1m…），
# 被 cat 进报告再发成评论后 GitHub 不解析转义 → 页面上出现 [33mwarn[39m 之类乱码。
# 这里统一关色；github-script 侧再用 .github/scripts/review-comment.cjs 兜底剥离（双保险）。
env:
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb

jobs:
  # 代码质量审查
  code-quality:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code quality checks
        run: |
          echo "## 🔍 代码质量审查报告" >> review-report.md
          echo "" >> review-report.md

          # ESLint 检查
          echo "### ESLint 检查" >> review-report.md
          if npx eslint plugins/ --format json > eslint-report.json 2>&1; then
            echo "✅ ESLint 检查通过" >> review-report.md
          else
            echo "❌ ESLint 检查失败" >> review-report.md
            npx eslint plugins/ --format compact >> review-report.md 2>&1
          fi
          echo "" >> review-report.md

          # TypeScript 检查
          echo "### TypeScript 检查" >> review-report.md
          if npx tsc --noEmit > ts-report.txt 2>&1; then
            echo "✅ TypeScript 检查通过" >> review-report.md
          else
            echo "❌ TypeScript 检查失败" >> review-report.md
            cat ts-report.txt >> review-report.md
          fi
          echo "" >> review-report.md

          # 代码复杂度检查
          echo "### 代码复杂度检查" >> review-report.md
          if npx eslint plugins/ --rule 'complexity: ["error", 10]' > complexity-report.txt 2>&1; then
            echo "✅ 代码复杂度符合要求（≤10）" >> review-report.md
          else
            echo "❌ 代码复杂度超标" >> review-report.md
            cat complexity-report.txt >> review-report.md
          fi
          echo "" >> review-report.md

          # 文件大小检查
          echo "### 文件大小检查" >> review-report.md
          if npm run lint:size > size-report.txt 2>&1; then
            echo "✅ 文件大小符合要求" >> review-report.md
          else
            echo "❌ 文件大小超标" >> review-report.md
            cat size-report.txt >> review-report.md
          fi
          echo "" >> review-report.md

          # 依赖分析
          echo "### 依赖分析" >> review-report.md
          if npx depcruise plugins/ > deps-report.txt 2>&1; then
            echo "✅ 依赖结构正常" >> review-report.md
          else
            echo "❌ 依赖结构异常" >> review-report.md
            cat deps-report.txt >> review-report.md
          fi
          echo "" >> review-report.md

      - name: Comment code quality report
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            const { upsertReviewComment } = require('./.github/scripts/review-comment.cjs');
            const report = fs.readFileSync('review-report.md', 'utf8');
            const res = await upsertReviewComment({
              github,
              context,
              id: 'code-quality',
              heading: '## 🔍 代码质量审查报告',
              report,
            });
            console.log(`review comment ${res.action}: #${res.commentId}, ESC=${res.escapeCount}`);

