# 全面自动审查工作流（唯一的 PR 自动审查 workflow，issue #303）
#
# 去重：原 auto-code-review.yml 的 5 个 job 是本文件 7 个 job 的真子集，两者监听同一事件
# → 每次 push 发两套报告（#295 累计 36 条 bot 评论），已删除该文件。
#
# 报告规范（issue #303 + 工程效率规范第十三节）：
#   - 三段结构：## 结论（通过 / 不通过 / 未能判定）→ ## 关键证据（中文摘要，超出即截断）
#     → ## 建议；每条 ≤30 行，全中文，禁止裸贴工具原始输出；
#   - 严禁把「没真正跑」写成通过：超时 / 命令缺失 / 依赖或网络不可用 / 无输出 /
#     统计不出问题 / 一条检查都没执行 → 结论必须是「未能判定」；
#   - 所有进评论的文本都经剥色（NO_COLOR + FORCE_COLOR=0 + 正则兜底），杜绝 ANSI 乱码；
#   - 7 个 job 各自上传报告 artifact，由 publish job 汇总成**一条** sticky 评论（含历史结论摘要）。
#
# 确定性（issue #311，判定内核：.github/scripts/review-verdict.cjs，纯函数 + 单测）：
#   - 判定不依赖网络/时序/随机：除「读 CI 已产生的运行结果」外没有其它输入，同一输入必得同一结论；
#   - 测试类检查**引用 CI 的权威结果**（`gh run list --commit <head sha>`，有界等待），不自己再跑一遍；
#     同一 commit 的 CI 既有成功又有失败/超时 → 结论仍按成功那次给出（通过），失败按「疑似环境抖动」标注；
#   - sticky 评论里保留历史结论摘要（`检查 N 次：通过 ×2、疑似抖动 ×1`）+ 本次判定的 commit SHA，
#     同一 commit 结论不一致时显式给出差异解释，而不是静默翻转。

name: Comprehensive Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 手动复检（同一 commit 重复检查应得同一结论，用它取证）
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb

jobs:
  # 代码质量审查
  code-quality:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code quality checks
        run: |
          source .github/scripts/lib/review-check.sh
          review_init review-report.md "代码质量"
          run_check review-report.md "ESLint 静态检查" eslint npx eslint plugins/ --format json
          run_check review-report.md "TypeScript 类型检查" tsc npx tsc --noEmit
          review_check_scope review-report.md "圈复杂度（门禁口径：plugins/*/src，阈值 10）" complexity gate npx eslint plugins/ --rule 'complexity: ["error", 10]' --format json
          review_finish review-report.md "- 优先处理「不通过」项；圈复杂度超标建议拆分函数（阈值 10，见 quality-gates）。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-code-quality
          path: review-report.md
          retention-days: 1
          if-no-files-found: ignore

  # 安全审查
  security-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security checks
        run: |
          source .github/scripts/lib/review-check.sh
          review_init security-report.md "安全审查"
          run_check security-report.md "依赖漏洞审计（npm audit）" npm-audit npm audit --audit-level=moderate
          review_not_covered security-report.md "CodeQL / 密钥扫描" "平台托管（Security 页），本 job 无法给出即时结论"
          review_finish security-report.md "- 高危及以上漏洞请在合并前处理；无修复版本的依赖需评估替代方案（CodeQL/密钥扫描见仓库 Security 页）。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-security-review
          path: security-report.md
          retention-days: 1
          if-no-files-found: ignore

  # 性能与结构审查
  performance-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run performance checks
        run: |
          source .github/scripts/lib/review-check.sh
          review_init performance-report.md "性能与结构"
          review_check_scope performance-report.md "圈复杂度（门禁口径：plugins/*/src，阈值 10）" complexity gate npx eslint plugins/ --rule 'complexity: ["error", 10]' --format json
          run_check performance-report.md "文件大小门禁" generic npm run lint:size
          run_check performance-report.md "依赖结构（无环）" generic npx depcruise plugins/
          review_finish performance-report.md "- 复杂度/文件大小超标优先拆分；依赖环需解耦（见 dependency-cruiser 配置）。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-performance-review
          path: performance-report.md
          retention-days: 1
          if-no-files-found: ignore

  # 测试审查（issue #311：引用 CI 的权威结果，**不重复跑测试**——自己再跑一遍会把仓库 flaky
  # 当成「代码不通过」，同一 commit 时红时绿；这里只读该 commit 上 CI 的真实结果）
  test-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Summarize test status (引用 CI 权威结果)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_CI_WAIT: '600'
        run: |
          source .github/scripts/lib/review-check.sh
          review_init test-report.md "测试"
          review_ci_authoritative test-report.md "测试与覆盖率（CI 权威结果）" "$HEAD_SHA" ci.yml
          review_finish test-report.md "- 测试/覆盖率以 CI workflow（job: test / coverage-finish）的结果为准；本 job 不重复执行，不产生第二套口径。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-test-review
          path: test-report.md
          retention-days: 1
          if-no-files-found: ignore

  # 文档审查
  documentation-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run documentation checks
        run: |
          source .github/scripts/lib/review-check.sh
          review_init docs-report.md "文档"
          run_check docs-report.md "文档一致性检查" generic node scripts/check-docs.mjs
          run_check docs-report.md "链接完整性检查" generic npm run check:links
          run_check docs-report.md "格式检查（Prettier）" prettier npx prettier --check . --no-color
          review_finish docs-report.md "- 格式问题本地执行 npm run format；链接/一致性失败见上方条目。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-documentation-review
          path: docs-report.md
          retention-days: 1
          if-no-files-found: ignore

  # API 设计审查（当前无自动化检查，如实标注「未能判定」，不再输出伪结论）
  api-design-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Summarize API design review
        run: |
          source .github/scripts/lib/review-check.sh
          review_init api-report.md "API 设计"
          review_not_covered api-report.md "公开 API 兼容性" "尚未接入自动化检查（原实现只输出固定文案）"
          review_finish api-report.md "- 涉及公开 API 的改动请人工确认兼容性，并同步文档与 CHANGELOG。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-api-design-review
          path: api-report.md
          retention-days: 1
          if-no-files-found: ignore

  # 依赖审查
  dependency-review:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run dependency checks
        run: |
          source .github/scripts/lib/review-check.sh
          review_init dependency-report.md "依赖"
          run_check dependency-report.md "依赖漏洞审计（npm audit）" npm-audit npm audit --audit-level=moderate
          review_finish dependency-report.md "- 高危漏洞先处理；无修复版本时评估替代依赖或临时白名单（需在 PR 里说明）。"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-dependency-review
          path: dependency-report.md
          retention-days: 1
          if-no-files-found: ignore

  # 汇总发布：把 7 份报告合成**一条** sticky 评论（含「判定对象 commit + 历史结论摘要」，超长即截断）
  publish:
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - security-review
      - performance-review
      - test-review
      - documentation-review
      - api-design-review
      - dependency-review
    if: always() && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: reports
          pattern: review-*

      - name: Publish consolidated review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const {
              publishReviewComment,
              buildConsolidated,
              parseReport,
              reviewMarker,
              OUTCOMES,
            } = require('./.github/scripts/review-comment.cjs')
            const {
              parseHistory,
              mergeHistoryEntry,
              historyOutcome,
              explainConsistency,
              shortSha,
            } = require('./.github/scripts/review-verdict.cjs')

            const ORDER = [
              ['review-code-quality', '代码质量'],
              ['review-security-review', '安全'],
              ['review-performance-review', '性能与结构'],
              ['review-test-review', '测试'],
              ['review-documentation-review', '文档'],
              ['review-api-design-review', 'API 设计'],
              ['review-dependency-review', '依赖'],
            ]

            const sections = []
            for (const [dir, name] of ORDER) {
              const dirPath = path.join('reports', dir)
              let md = ''
              if (fs.existsSync(dirPath)) {
                const file = fs.readdirSync(dirPath).find((f) => f.endsWith('.md'))
                if (file) md = fs.readFileSync(path.join(dirPath, file), 'utf8')
              }
              if (!md) md = `## 结论\n\n${OUTCOMES.UNKNOWN}（未收到报告 artifact，请查看该 job 日志）`
              sections.push({ name, md })
            }

            // 判定对象 = 本次审查的那个 commit；同一 commit 重复检查必须得到同一结论
            const sha = (context.payload.pull_request && context.payload.pull_request.head.sha) || context.sha || ''
            const short = shortSha(sha)

            // workflow_dispatch（手动复检）没有 PR payload → 按分支找对应的 open PR
            let prNumber = context.payload.pull_request ? context.payload.pull_request.number : undefined
            if (!prNumber) {
              const branch = String(context.ref || '').replace('refs/heads/', '')
              const found = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branch}`,
              })
              prNumber = found.data[0] ? found.data[0].number : undefined
            }
            if (!prNumber) {
              core.notice('未找到对应的 open PR，跳过审查评论（手动复检请指定 PR 所在分支）')
              return
            }
            // ⚠️ 不要用 `{ ...context }`——github-script 的 context 把 repo/payload 等实现为
            // 原型上的 getter，展开会丢掉它们（真机实测：`context.repo` undefined →
            // upsertReviewComment 抛 TypeError，publish 变红、评论根本没发出来）。
            const ctx = {
              repo: context.repo,
              issue: { number: prNumber },
              payload: context.payload,
              sha: context.sha,
              ref: context.ref,
            }

            const id = 'comprehensive-review'
            const marker = reviewMarker(id)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            })
            const previous = comments.find(
              (c) => c.user && c.user.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker)
            )

            const draft = buildConsolidated(sections, { maxLines: 30 })
            const outcome = parseReport(draft).conclusion
            // 抖动计数从各 job 报告里取（不依赖被截断后的总评论正文）
            const flaky = sections.reduce((sum, s) => sum + parseReport(s.md).flaky, 0)
            const recorded = historyOutcome(outcome, flaky)

            const notes = []
            if (flaky > 0) {
              notes.push('同一 commit 的 CI 存在失败/超时运行，已按「疑似环境抖动」标注，不计入代码问题。')
            }
            const prevEntries = parseHistory(previous ? previous.body : '')
            const consistency = explainConsistency(prevEntries, sha, recorded)
            if (consistency) notes.push(consistency)

            const { historyLine, historyComment } = mergeHistoryEntry(previous ? previous.body : '', {
              sha,
              outcome: recorded,
            })
            const report = buildConsolidated(sections, {
              maxLines: 30,
              historyLine,
              historyComment,
              sha: short,
              notes,
            })

            const res = await publishReviewComment({
              github,
              context: ctx,
              id,
              heading: '## 🧾 PR 自动审查（结论摘要）',
              report,
              writeSummary: async (text) => {
                await core.summary.addRaw(text).write()
              },
            })
            if (res.forbidden) {
              core.warning(`审查评论未能发布（无写权限，已把结论写入 job summary）：${res.reason}`)
            }
            core.info(
              `review comment ${res.action}: #${res.commentId}, ESC=${res.escapeCount}, sections=${sections.length}, ` +
                `commit=${short}, outcome=${outcome}, recorded=${recorded}, flaky=${flaky}`
            )
            // 历史行打进日志：评论正文不便于事后取证（也便于确认「同一 commit 结论是否稳定」）
            core.info(`history: ${historyLine || '(无)'}`)
