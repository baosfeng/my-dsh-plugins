# 优化后的发版工作流
# 改进：
# 1. 添加 npm 缓存，减少安装时间
# 2. 并行执行测试和打包
# 3. 添加发版前验证
# 4. 优化错误处理

name: Release Optimized

on:
  push:
    tags: ['*@v*']

permissions:
  contents: write
  issues: write

jobs:
  # 并行执行：验证 + 测试
  validate:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.parse.outputs.plugin }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Parse plugin and version from tag
        id: parse
        run: |
          TAG="$GITHUB_REF_NAME"
          PLUGIN="${TAG%%@v*}"
          VERSION="${TAG##*@v}"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate plugin directory
        run: |
          test -d "plugins/${{ steps.parse.outputs.plugin }}" || { echo "::error::unknown plugin '${{ steps.parse.outputs.plugin }}'"; exit 1; }

      - name: Verify tag matches package.json
        run: |
          expected="$(node -p "require('./plugins/${{ steps.parse.outputs.plugin }}/package.json').version")"
          if [ "${{ steps.parse.outputs.version }}" != "$expected" ]; then
            echo "::error::tag version '${{ steps.parse.outputs.version }}' does not match package.json version '$expected'"
            exit 1
          fi

  # 并行执行：测试
  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ${{ needs.validate.outputs.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: (cd "plugins/${{ matrix.plugin }}" && npm test)

  # 并行执行：打包
  pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack tarball
        run: |
          mkdir -p dist
          (cd "plugins/${{ needs.validate.outputs.plugin }}" && npm pack --pack-destination "$OLDPWD/dist")

      - name: Extract release body
        run: node .github/scripts/extract-release-body.mjs "plugins/${{ needs.validate.outputs.plugin }}/CHANGELOG.md" "${{ needs.validate.outputs.version }}" dist/release-body.md

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: dist/

  # 发版：依赖测试和打包完成
  release:
    needs: [validate, test, pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: dist/

      - name: Publish to npm
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secrets 未配置——跳过 npm 发布"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          if (cd "plugins/${{ needs.validate.outputs.plugin }}" && npm publish --access public); then
            echo "::notice::${{ needs.validate.outputs.plugin }}@${{ needs.validate.outputs.version }} published to npm"
          else
            echo "::warning::npm publish failed; GitHub Release continues"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*.tgz
          body_path: dist/release-body.md
          generate_release_notes: true

      - name: Notify failure via issue
        if: failure()
        run: node .github/scripts/notify-failure.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
