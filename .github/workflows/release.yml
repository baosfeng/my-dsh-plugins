name: Release

# Create a GitHub Release whenever a `<plugin>@v<version>` tag is pushed,
# e.g. `dsh-file-activity@v0.1.0`. The tag embeds the plugin directory name
# and the version; the version MUST equal the plugin's package.json version
# (enforced below).

on:
  push:
    tags: ['*@v*']

permissions:
  contents: write # allow creating the GitHub Release
  issues: write # allow creating a failure-notification issue (issue #36)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm # 缓存 npm 缓存目录（key 基于 package-lock.json hash），加速 npm ci

      - name: Install root test toolchain
        run: npm ci --no-audit --no-fund

      - name: Parse plugin and version from tag
        run: |
          TAG="$GITHUB_REF_NAME"
          PLUGIN="${TAG%%@v*}"
          VERSION="${TAG##*@v}"
          echo "PLUGIN=$PLUGIN" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate plugin directory
        run: |
          test -d "plugins/$PLUGIN" || { echo "::error::unknown plugin '$PLUGIN' (no plugins/$PLUGIN directory)"; exit 1; }

      - name: Smoke test (host half)
        run: |
          (cd "plugins/$PLUGIN" && npm test)

      - name: Verify the git tag matches package.json version
        run: |
          expected="$(node -p "require('./plugins/$PLUGIN/package.json').version")"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::tag version '$VERSION' does not match plugins/$PLUGIN package.json version '$expected'"
            exit 1
          fi

      - name: Pack tarball for the GitHub Release
        run: |
          mkdir -p dist
          (cd "plugins/$PLUGIN" && npm pack --pack-destination "$OLDPWD/dist")

      - name: Extract the matching CHANGELOG.md section as the release body
        run: node .github/scripts/extract-release-body.mjs "plugins/$PLUGIN/CHANGELOG.md" "$VERSION" dist/release-body.md

      # 可选：自动发布到 npm 官方（issue #12）。
      # - 需在仓库 secrets 配置 NPM_TOKEN（npm 账号 access token，publish 权限）；
      # - 未配置 token 时仅警告并跳过，不影响 GitHub Release 主流程；
      # - 发布失败（包名已被他人占用，如 dsh-notify / dsh-guardian，或版本已存在）
      #   同样只警告不阻塞——GitHub Release 始终是主交付物。
      #   （本仓库撞名插件已统一 dsh-my-* 前缀：dsh-my-notify / dsh-my-guardian）
      - name: Publish to npm (requires NPM_TOKEN)
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secrets 未配置——跳过 npm 发布（GitHub Release 通道不受影响）"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          if (cd "plugins/$PLUGIN" && npm publish --access public); then
            echo "::notice::${PLUGIN}@${VERSION} published to npm"
          else
            echo "::warning::npm publish failed for ${PLUGIN}@${VERSION} (name taken or version exists); GitHub Release continues"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
          body_path: dist/release-body.md
          generate_release_notes: true

      # 失败通知（issue #36）：workflow 任一步骤失败时自动创建 issue，
      # 不再静默失败——发版问题可被发现、可追踪。
      - name: Notify failure via issue
        if: failure()
        run: node .github/scripts/notify-failure.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
