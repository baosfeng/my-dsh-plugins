<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill 管理 · 技能台（v3）</title>
<style>
/* ============================================================
   技能台 Skill Deck — v3 原型
   颜色全部收敛在 :root（含浅色主题 :root[data-theme="light"]）
   ============================================================ */
:root{
  color-scheme: dark;
  --sk-desk:#050607;
  --sk-bg:#0d0f13;
  --sk-chrome:#111419;
  --sk-panel:#14171c;
  --sk-surface:#191d24;
  --sk-surface-2:#1e232b;
  --sk-surface-3:#252b34;
  --sk-fg:#dfe3ea;
  --sk-fg-strong:#f4f6fa;
  --sk-muted:#9aa3b0;
  --sk-subtle:#8b94a1;
  --sk-border:#252b34;
  --sk-border-strong:#363e49;
  --sk-accent:#7aa2f7;
  --sk-accent-strong:#93b4ff;
  --sk-accent-soft:#1a2433;
  --sk-accent-ring:rgba(122,162,247,.3);
  --sk-on-accent:#0b0f16;
  --sk-success:#57c08a;
  --sk-success-soft:#14251c;
  --sk-warn:#dda05e;
  --sk-warn-soft:#2a2117;
  --sk-danger:#e07a7a;
  --sk-danger-soft:#2b1a1c;
  --sk-on-danger:#1b0e0e;
  --sk-focus:#7aa2f7;
  --sk-code-bg:#101318;
  --sk-code-fg:#b9c2cf;
  --sk-track:#2a313b;
  --sk-knob:#c6cedb;
  --sk-hover:#1e232b;
  --sk-selected:#1b2536;
  --sk-scroll:#343c47;
  --sk-fake:#12151a;
  --sk-fake-line:#1b2028;
  --sk-selection:#263449;
  --sk-overlay:rgba(0,0,0,.4);
  --sk-shadow-color:rgba(0,0,0,.55);
  --bg:var(--sk-bg);
  --surface:var(--sk-surface);
  --fg:var(--sk-fg);
  --muted:var(--sk-muted);
  --border:var(--sk-border);
  --accent:var(--sk-accent);
}
/* 浅色主题 token 调色板：色值统一收敛在 :root，主题块只做别名映射 */
:root{
  --sk-l-desk:#dfe3e9;
  --sk-l-bg:#eef0f3;
  --sk-l-chrome:#f5f6f8;
  --sk-l-panel:#ffffff;
  --sk-l-surface:#ffffff;
  --sk-l-surface-2:#f3f5f8;
  --sk-l-surface-3:#e9edf2;
  --sk-l-fg:#2a3038;
  --sk-l-fg-strong:#12161c;
  --sk-l-muted:#5c6674;
  --sk-l-subtle:#69737f;
  --sk-l-border:#e1e5ea;
  --sk-l-border-strong:#cbd2db;
  --sk-l-accent:#2f6fd0;
  --sk-l-accent-strong:#255ab0;
  --sk-l-accent-soft:#e9f1fc;
  --sk-l-accent-ring:rgba(47,111,208,.22);
  --sk-l-on-accent:#ffffff;
  --sk-l-success:#268a5b;
  --sk-l-success-soft:#e7f5ee;
  --sk-l-warn:#a8641c;
  --sk-l-warn-soft:#fbf1e4;
  --sk-l-danger:#b84747;
  --sk-l-danger-soft:#fbecec;
  --sk-l-on-danger:#ffffff;
  --sk-l-focus:#2f6fd0;
  --sk-l-code-bg:#f7f8fa;
  --sk-l-code-fg:#3b4552;
  --sk-l-track:#dfe4ea;
  --sk-l-knob:#ffffff;
  --sk-l-hover:#f2f4f7;
  --sk-l-selected:#eef4fd;
  --sk-l-scroll:#c4ccd6;
  --sk-l-fake:#e7eaef;
  --sk-l-fake-line:#d9dee5;
  --sk-l-selection:#d6e4fb;
  --sk-l-overlay:rgba(20,26,34,.16);
  --sk-l-shadow-color:rgba(20,30,45,.18);
}
:root[data-theme="light"]{
  color-scheme: light;
  --sk-desk:var(--sk-l-desk);
  --sk-bg:var(--sk-l-bg);
  --sk-chrome:var(--sk-l-chrome);
  --sk-panel:var(--sk-l-panel);
  --sk-surface:var(--sk-l-surface);
  --sk-surface-2:var(--sk-l-surface-2);
  --sk-surface-3:var(--sk-l-surface-3);
  --sk-fg:var(--sk-l-fg);
  --sk-fg-strong:var(--sk-l-fg-strong);
  --sk-muted:var(--sk-l-muted);
  --sk-subtle:var(--sk-l-subtle);
  --sk-border:var(--sk-l-border);
  --sk-border-strong:var(--sk-l-border-strong);
  --sk-accent:var(--sk-l-accent);
  --sk-accent-strong:var(--sk-l-accent-strong);
  --sk-accent-soft:var(--sk-l-accent-soft);
  --sk-accent-ring:var(--sk-l-accent-ring);
  --sk-on-accent:var(--sk-l-on-accent);
  --sk-success:var(--sk-l-success);
  --sk-success-soft:var(--sk-l-success-soft);
  --sk-warn:var(--sk-l-warn);
  --sk-warn-soft:var(--sk-l-warn-soft);
  --sk-danger:var(--sk-l-danger);
  --sk-danger-soft:var(--sk-l-danger-soft);
  --sk-on-danger:var(--sk-l-on-danger);
  --sk-focus:var(--sk-l-focus);
  --sk-code-bg:var(--sk-l-code-bg);
  --sk-code-fg:var(--sk-l-code-fg);
  --sk-track:var(--sk-l-track);
  --sk-knob:var(--sk-l-knob);
  --sk-hover:var(--sk-l-hover);
  --sk-selected:var(--sk-l-selected);
  --sk-scroll:var(--sk-l-scroll);
  --sk-fake:var(--sk-l-fake);
  --sk-fake-line:var(--sk-l-fake-line);
  --sk-selection:var(--sk-l-selection);
  --sk-overlay:var(--sk-l-overlay);
  --sk-shadow-color:var(--sk-l-shadow-color);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--sk-desk);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
button{font:inherit;color:var(--fg);background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
code,pre,kbd{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
svg{display:block;flex:none}
[hidden]{display:none!important}
::selection{background:var(--sk-selection);color:var(--sk-fg-strong)}
:where(button,input,a,[tabindex]):focus-visible{outline:2px solid var(--sk-focus);outline-offset:2px;border-radius:6px}
.sk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@keyframes sk-pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes sk-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes sk-spin{to{transform:rotate(360deg)}}
@keyframes sk-pulse{0%,100%{opacity:.5}50%{opacity:.9}}

/* ---------- 画布与窗口 ---------- */
.sk-canvas{
  position:relative;width:min(1440px,100vw);height:min(900px,100vh);
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sk-winbar{
  position:relative;z-index:30;flex:none;height:40px;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--sk-chrome);box-shadow:inset 0 -1px 0 var(--border);
}
.sk-traffic{display:flex;align-items:center;gap:7px}
.sk-traffic span{width:10px;height:10px;border-radius:50%;background:var(--sk-subtle);opacity:.45}
.sk-win-title{font-size:11.5px;color:var(--sk-subtle);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-win-title b{color:var(--sk-muted);font-weight:500}
.sk-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.sk-tool-btn{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:7px;
  color:var(--sk-muted);font-size:11.5px;white-space:nowrap;
}
.sk-tool-btn:hover{background:var(--sk-hover);color:var(--fg)}
.sk-tool-btn[aria-expanded="true"]{background:var(--sk-surface-2);color:var(--fg)}
.sk-demo-wrap{position:relative}
.sk-menu{
  position:absolute;top:calc(100% + 8px);right:0;width:200px;padding:6px;
  background:var(--sk-surface);border-radius:10px;box-shadow:0 0 0 1px var(--sk-border-strong),0 16px 44px var(--sk-shadow-color);
  z-index:60;animation:sk-pop .2s ease-out both;
}
.sk-menu-label{padding:6px 8px 4px;font-size:10px;letter-spacing:.08em;color:var(--sk-subtle)}
.sk-menu-item{
  display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:6px;
  font-size:12px;color:var(--sk-muted);text-align:left;
}
.sk-menu-item:hover{background:var(--sk-hover);color:var(--fg)}
.sk-menu-item[aria-checked="true"]{color:var(--sk-fg-strong)}
.sk-menu-check{display:inline-grid;place-items:center;width:14px;color:var(--sk-accent);opacity:0}
.sk-menu-item[aria-checked="true"] .sk-menu-check{opacity:1}
.sk-menu-sep{height:1px;background:var(--border);margin:6px 4px}

/* ---------- 舞台与面板 ---------- */
.sk-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:30px}
.sk-appfake{position:absolute;inset:0;display:flex;gap:14px;padding:22px;pointer-events:none;opacity:.42}
.sk-fake-rail{
  flex:none;width:210px;border-radius:10px;background:var(--sk-fake);
  box-shadow:inset 0 0 0 1px var(--border);padding:14px;display:flex;flex-direction:column;gap:9px;
}
.sk-fake-line{height:8px;border-radius:4px;background:var(--sk-fake-line)}
.sk-fake-line.sk-w25{width:25%}.sk-fake-line.sk-w40{width:40%}.sk-fake-line.sk-w60{width:60%}.sk-fake-line.sk-w80{width:80%}
.sk-fake-main{
  flex:1;border-radius:10px;background:var(--sk-fake);box-shadow:inset 0 0 0 1px var(--border);
  display:flex;flex-direction:column;gap:12px;padding:18px;
}
.sk-fake-block{flex:1;border-radius:8px;background:var(--sk-fake-line);opacity:.6}
.sk-panel{
  position:relative;z-index:2;width:min(800px,100%);height:min(800px,100%);
  display:flex;flex-direction:column;background:var(--sk-panel);border-radius:14px;
  box-shadow:0 0 0 1px var(--sk-border-strong),0 30px 80px var(--sk-shadow-color);
  overflow:hidden;
}
.sk-panel-head{
  flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:var(--sk-panel);box-shadow:inset 0 -1px 0 var(--border);
}
.sk-panel-head h1{margin:0;font-size:14px;font-weight:600;color:var(--sk-fg-strong);letter-spacing:.01em}
.sk-crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sk-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-slash{color:var(--sk-subtle)}
.sk-panel-head .sk-icon-btn{margin-left:auto}
.sk-panel-body{flex:1;min-height:0;display:flex}
.sk-nav{
  flex:none;width:188px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:2px;
  background:var(--sk-panel);box-shadow:inset -1px 0 0 var(--border);overflow:auto;
}
.sk-nav-label{margin:10px 8px 4px;font-size:10px;letter-spacing:.1em;color:var(--sk-subtle)}
.sk-nav-label:first-child{margin-top:0}
.sk-nav-item{
  display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 9px;border-radius:7px;
  font-size:12.5px;color:var(--sk-muted);text-align:left;white-space:nowrap;
}
.sk-nav-item svg{color:var(--sk-subtle)}
.sk-nav-item:hover{background:var(--sk-hover);color:var(--fg)}
.sk-nav-item[aria-current="page"]{background:var(--sk-surface-2);color:var(--sk-fg-strong);box-shadow:inset 2px 0 0 var(--sk-accent)}
.sk-nav-item[aria-current="page"] svg{color:var(--sk-accent)}
.sk-nav-foot{
  margin-top:auto;padding:10px 8px 2px;display:flex;align-items:center;gap:8px;
  box-shadow:inset 0 1px 0 var(--border);
}
.sk-avatar{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--sk-surface-3);
  display:grid;place-items:center;font-size:9px;color:var(--sk-muted);letter-spacing:.02em;
}
.sk-nav-foot div{min-width:0;font-size:10.5px;color:var(--sk-subtle);line-height:1.35}
.sk-nav-foot b{display:block;font-weight:500;font-size:11.5px;color:var(--sk-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 内容列 / 页签 ---------- */
.sk-content{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 24px 16px}
.sk-tabs{flex:none;display:flex;align-items:stretch;gap:18px;height:44px;box-shadow:inset 0 -1px 0 var(--border)}
.sk-tab{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sk-muted);padding:0 1px}
.sk-tab:hover{color:var(--fg)}
.sk-tab[aria-selected="true"]{color:var(--sk-fg-strong);font-weight:500}
.sk-tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.sk-tab-count{
  display:inline-flex;align-items:center;height:15px;padding:0 4px;border-radius:4px;
  background:var(--sk-surface-2);box-shadow:inset 0 0 0 1px var(--border);
  font-size:9px;font-weight:500;color:var(--sk-subtle);font-variant-numeric:tabular-nums;
}
.sk-tab-badge{
  display:inline-flex;align-items:center;height:15px;padding:0 4px;border-radius:4px;
  background:var(--sk-accent-soft);color:var(--sk-accent);font-size:9px;font-weight:600;
}
.sk-view{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:12px;position:relative}
.sk-fade{animation:sk-fade .2s ease-out both}

/* ---------- 命令条 ---------- */
.sk-command{flex:none;display:flex;flex-direction:column;gap:8px}
.sk-search-row{display:flex;align-items:center;gap:8px}
.sk-search{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 9px;border-radius:8px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);color:var(--sk-subtle);
}
.sk-search:focus-within{box-shadow:inset 0 0 0 1px var(--sk-accent),0 0 0 3px var(--sk-accent-ring)}
.sk-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--sk-fg-strong);font-size:12.5px;caret-color:var(--sk-accent)}
.sk-search input::placeholder{color:var(--sk-subtle)}
.sk-kbd{
  flex:none;display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:4px;
  background:var(--sk-surface-2);box-shadow:inset 0 0 0 1px var(--border);
  color:var(--sk-subtle);font-size:10px;font-family:inherit;
}
.sk-search-clear{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:4px;color:var(--sk-subtle)}
.sk-search-clear:hover{background:var(--sk-hover);color:var(--fg)}
.sk-scan{
  flex:none;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);color:var(--sk-muted);font-size:11.5px;
}
.sk-scan:hover{background:var(--sk-surface-2);color:var(--fg)}
.sk-scan:disabled{cursor:progress;color:var(--sk-subtle)}
.sk-scan.sk-loading svg{animation:sk-spin .9s linear infinite}
.sk-stats-row{display:flex;align-items:center;gap:8px}
.sk-stats{
  flex:1;min-width:0;display:flex;border-radius:8px;overflow:hidden;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);
}
.sk-stat{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;height:34px;
  color:var(--sk-muted);font-size:11px;box-shadow:inset -1px 0 0 var(--border);
}
.sk-stat:last-child{box-shadow:none}
.sk-stat b{font-size:14px;font-weight:600;color:var(--sk-fg-strong);font-variant-numeric:tabular-nums}
.sk-stat:hover{background:var(--sk-hover)}
.sk-stat[aria-pressed="true"]{background:var(--sk-accent-soft)}
.sk-stat[aria-pressed="true"] b{color:var(--sk-accent)}
.sk-stat--warn b{color:var(--sk-warn)}
.sk-diag-entry{
  flex:none;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;
  background:var(--sk-warn-soft);color:var(--sk-warn);font-size:11.5px;
  box-shadow:inset 0 0 0 1px var(--sk-warn);white-space:nowrap;
}
.sk-diag-entry b{font-variant-numeric:tabular-nums}
.sk-diag-entry:hover{background:var(--sk-surface-2)}

/* ---------- 筛选 ---------- */
.sk-filters{
  flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 0;margin-top:8px;
  box-shadow:inset 0 -1px 0 var(--border);
}
.sk-filter-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sk-filter-label{min-width:24px;margin-right:2px;font-size:10px;color:var(--sk-subtle);letter-spacing:.04em}
.sk-chip{
  display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;border-radius:999px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);
  color:var(--sk-muted);font-size:10.5px;white-space:nowrap;
}
.sk-chip b{font-weight:600;color:var(--sk-subtle);font-variant-numeric:tabular-nums}
.sk-chip:hover{background:var(--sk-surface-2);color:var(--fg)}
.sk-chip[aria-pressed="true"]{background:var(--sk-accent-soft);box-shadow:inset 0 0 0 1px var(--sk-accent);color:var(--sk-fg-strong)}
.sk-chip[aria-pressed="true"] b{color:var(--sk-accent)}
.sk-chip--unused[aria-pressed="true"]{background:var(--sk-warn-soft);box-shadow:inset 0 0 0 1px var(--sk-warn);color:var(--sk-fg-strong)}
.sk-chip--unused[aria-pressed="true"] b{color:var(--sk-warn)}
.sk-filter-sep{width:1px;height:14px;margin:0 3px;background:var(--border)}
.sk-chip .sk-src-dot{display:inline-block;width:5px;height:5px;margin-right:1px}

/* ---------- 工具条 ---------- */
.sk-toolbar{flex:none;display:flex;align-items:center;gap:8px;height:38px}
.sk-result{font-size:11px;color:var(--sk-subtle);white-space:nowrap}
.sk-result b{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.sk-scan-time{font-size:10.5px;color:var(--sk-subtle);white-space:nowrap}
.sk-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.sk-seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border)}
.sk-seg button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:5px;font-size:10.5px;color:var(--sk-muted)}
.sk-seg button:hover{color:var(--fg)}
.sk-seg button[aria-pressed="true"]{background:var(--sk-surface-3);color:var(--sk-fg-strong)}
.sk-sortwrap{position:relative}
.sk-tool-btn--text{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);color:var(--sk-muted);font-size:11px;
}
.sk-tool-btn--text:hover{background:var(--sk-surface-2);color:var(--fg)}
.sk-sort-menu{width:164px}
.sk-sort-dir{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;color:var(--sk-muted)}
.sk-sort-dir:hover{background:var(--sk-hover);color:var(--fg)}
.sk-select-btn{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);color:var(--sk-muted);font-size:11px;
}
.sk-select-btn:hover{background:var(--sk-surface-2);color:var(--fg)}
.sk-select-btn[aria-pressed="true"]{background:var(--sk-accent-soft);box-shadow:inset 0 0 0 1px var(--sk-accent);color:var(--sk-fg-strong)}

/* ---------- 列表区 ---------- */
.sk-stagearea{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sk-listwrap{
  flex:1;min-height:0;overflow:auto;padding:2px 2px 4px;
  scrollbar-width:thin;scrollbar-color:var(--sk-scroll) var(--sk-panel);
}
.sk-listwrap::-webkit-scrollbar,.sk-statearea::-webkit-scrollbar,.sk-tablewrap::-webkit-scrollbar,.sk-diag::-webkit-scrollbar{width:8px;height:8px}
.sk-listwrap::-webkit-scrollbar-thumb,.sk-statearea::-webkit-scrollbar-thumb,.sk-tablewrap::-webkit-scrollbar-thumb,.sk-diag::-webkit-scrollbar-thumb{background:var(--sk-scroll);border-radius:8px}
.sk-listwrap::-webkit-scrollbar-track,.sk-statearea::-webkit-scrollbar-track,.sk-tablewrap::-webkit-scrollbar-track,.sk-diag::-webkit-scrollbar-track{background:var(--sk-panel)}

/* ---------- 来源分组 ---------- */
.sk-group{padding-bottom:6px}
.sk-group-head{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:7px;
  padding:7px 2px 6px;margin-bottom:7px;background:var(--sk-panel);
  box-shadow:inset 0 -1px 0 var(--border);
}
.sk-group-head h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--sk-fg)}
.sk-group-count{
  display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;
  background:var(--sk-surface-2);box-shadow:inset 0 0 0 1px var(--border);
  color:var(--sk-muted);font-size:9.5px;font-variant-numeric:tabular-nums;
}
.sk-group-provider{
  margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10px;color:var(--sk-subtle);
}
.sk-group-body{display:flex;flex-direction:column;gap:7px}
.sk-src-dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--sk-subtle)}
.sk-src-dot--project{background:var(--sk-accent)}
.sk-src-dot--user{background:var(--sk-muted)}
.sk-src-dot--bundled{background:var(--sk-subtle)}
.sk-src-dot--anomaly{background:var(--sk-warn)}

/* ---------- 技能卡 ---------- */
.sk-card{
  position:relative;padding:9px 10px 8px 16px;border-radius:10px;
  background:var(--sk-surface,var(--surface));box-shadow:inset 0 0 0 1px var(--border);
}
.sk-card:hover{background:var(--sk-surface-2)}
.sk-card.sk-selected{box-shadow:inset 0 0 0 1px var(--sk-accent),0 0 0 3px var(--sk-accent-ring)}
.sk-card-bar{
  position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px;
  background:var(--sk-success);
}
.sk-card.sk-off .sk-card-bar{background:var(--sk-subtle)}
.sk-card.sk-anomaly .sk-card-bar{background:var(--sk-warn)}
.sk-card-top{display:flex;align-items:center;gap:8px;min-width:0}
.sk-checkbox{flex:none;width:13px;height:13px;margin:0;accent-color:var(--sk-accent);cursor:pointer}
.sk-card-open{display:flex;align-items:center;gap:6px;flex:1;min-width:0;text-align:left}
.sk-card-open:focus-visible{outline-offset:3px}
.sk-name{
  min-width:0;font-size:12.8px;font-weight:600;color:var(--sk-fg-strong);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sk-card.sk-off .sk-name{color:var(--sk-muted)}
.sk-badge{
  display:inline-flex;align-items:center;flex:none;height:16px;padding:0 5px;border-radius:4px;
  background:var(--sk-surface-3);color:var(--sk-muted);font-size:9.5px;font-weight:500;white-space:nowrap;
}
.sk-badge--warn{background:var(--sk-warn-soft);color:var(--sk-warn);box-shadow:inset 0 0 0 1px var(--sk-warn)}
.sk-badge--quiet{background:var(--sk-panel);color:var(--sk-subtle);box-shadow:inset 0 0 0 1px var(--border)}
.sk-usage{
  display:inline-flex;align-items:center;gap:4px;margin-left:auto;flex:none;
  font-size:10px;color:var(--sk-subtle);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.sk-usage svg{color:var(--sk-subtle)}
.sk-chevron{flex:none;color:var(--sk-subtle);transition:transform .18s ease}
.sk-card[data-expanded="true"] .sk-chevron{transform:rotate(180deg)}
.sk-desc{
  margin:4px 0 7px;font-size:11px;line-height:1.5;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sk-card.sk-off .sk-desc{color:var(--sk-subtle)}
.sk-card-foot{display:flex;align-items:center;gap:8px;min-height:20px;flex-wrap:wrap}
.sk-scopes{display:inline-flex;align-items:center;gap:10px}
.sk-scopes.sk-dim{opacity:.55}
.sk-switch{
  display:inline-flex;align-items:center;gap:5px;padding:1px 2px;border-radius:6px;
  font-size:10px;color:var(--sk-subtle);white-space:nowrap;
}
.sk-switch:hover{color:var(--sk-muted)}
.sk-track{
  position:relative;width:26px;height:15px;border-radius:999px;background:var(--sk-track);
  box-shadow:inset 0 0 0 1px var(--sk-border-strong);
}
.sk-knob{
  position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;
  background:var(--sk-knob);transition:transform .16s ease;
}
.sk-switch[aria-checked="true"]{color:var(--sk-fg)}
.sk-switch[aria-checked="true"] .sk-track{background:var(--sk-accent-soft);box-shadow:inset 0 0 0 1px var(--sk-accent)}
.sk-switch[aria-checked="true"] .sk-knob{transform:translateX(11px);background:var(--sk-accent)}
.sk-switch.sk-warn-switch .sk-track{background:var(--sk-warn-soft);box-shadow:inset 0 0 0 1px var(--sk-warn)}
.sk-switch.sk-warn-switch .sk-knob{background:var(--sk-warn)}
.sk-switch[aria-disabled="true"],.sk-switch:disabled{cursor:not-allowed;opacity:.45}
.sk-switch--mini{gap:0}
.sk-switch--mini .sk-track{width:22px;height:13px}
.sk-switch--mini .sk-knob{width:10px;height:10px;top:1.5px;left:1.5px}
.sk-switch--mini[aria-checked="true"] .sk-knob{transform:translateX(9px)}
.sk-foot-note{margin-left:auto;font-size:9.8px;color:var(--sk-subtle);white-space:nowrap}

/* ---------- 内联错误 ---------- */
.sk-inline-error{
  display:flex;align-items:flex-start;gap:7px;margin-top:8px;padding:7px 8px;border-radius:7px;
  background:var(--sk-danger-soft);box-shadow:inset 0 0 0 1px var(--sk-danger);
  font-size:10.5px;color:var(--sk-danger);
}
.sk-inline-error > svg{color:var(--sk-danger);margin-top:1px}
.sk-inline-error div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sk-inline-error b{font-size:11px;font-weight:600;color:var(--sk-fg-strong)}
.sk-inline-error span{color:var(--sk-muted);line-height:1.45}

/* ---------- 焦点详情 ---------- */
.sk-detail{
  display:grid;grid-template-columns:1fr 1fr;margin-top:9px;padding-top:9px;
  box-shadow:inset 0 1px 0 var(--border);animation:sk-fade .18s ease-out both;
}
.sk-detail-col{min-width:0;padding-right:12px}
.sk-detail-col--right{padding-right:0;padding-left:12px;box-shadow:inset 1px 0 0 var(--border)}
.sk-detail-desc{margin:0 0 7px;font-size:11px;line-height:1.55;color:var(--sk-fg)}
.sk-meta{margin:0;display:flex;flex-direction:column;gap:5px}
.sk-meta-row{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:start;font-size:10.5px}
.sk-meta dt{color:var(--sk-subtle)}
.sk-meta dd{margin:0;min-width:0;display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap;color:var(--sk-muted)}
.sk-meta code{font-size:9.8px;line-height:1.45;color:var(--sk-muted);word-break:break-all}
.sk-cap{
  display:inline-flex;align-items:center;height:17px;padding:0 5px;border-radius:4px;
  background:var(--sk-surface-2);box-shadow:inset 0 0 0 1px var(--border);font-size:9.5px;color:var(--sk-muted);
}
.sk-icon-btn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;color:var(--sk-muted)}
.sk-icon-btn:hover{background:var(--sk-hover);color:var(--fg)}
.sk-icon-btn--sm{width:20px;height:20px;border-radius:5px;color:var(--sk-subtle);flex:none}
.sk-icon-btn--sm:hover{background:var(--sk-hover);color:var(--fg)}
.sk-preview-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:10px;color:var(--sk-subtle)}
.sk-preview-head em{font-style:normal;opacity:.8}
.sk-mini-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:5px;
  background:var(--sk-surface-2);box-shadow:inset 0 0 0 1px var(--border);font-size:10px;color:var(--sk-muted);
}
.sk-mini-btn:hover{color:var(--fg)}
.sk-pre{
  margin:0;padding:7px 8px;border-radius:7px;background:var(--sk-code-bg);
  box-shadow:inset 0 0 0 1px var(--border);color:var(--sk-code-fg);
  font-size:9.6px;line-height:1.5;max-height:240px;overflow:auto;white-space:pre;
  scrollbar-width:thin;scrollbar-color:var(--sk-scroll) var(--sk-code-bg);
}
.sk-pre::-webkit-scrollbar{width:7px;height:7px}
.sk-pre::-webkit-scrollbar-thumb{background:var(--sk-scroll);border-radius:7px}
.sk-usage-stats{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:9.8px;color:var(--sk-subtle);flex-wrap:wrap}
.sk-usage-stats b{font-size:11px;font-weight:600;color:var(--sk-fg)}
.sk-missing{
  display:flex;flex-direction:column;gap:5px;padding:9px;border-radius:7px;
  background:var(--sk-warn-soft);box-shadow:inset 0 0 0 1px var(--sk-warn);
  font-size:10px;line-height:1.5;color:var(--sk-muted);
}
.sk-missing b{font-size:10.5px;color:var(--sk-warn)}
.sk-missing code{font-size:9.6px;word-break:break-all;color:var(--sk-muted)}

/* ---------- 紧凑表 ---------- */
.sk-tablewrap{
  flex:1;min-height:0;overflow:auto;padding-right:2px;
  scrollbar-width:thin;scrollbar-color:var(--sk-scroll) var(--sk-panel);
}
.sk-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px}
.sk-table thead th{
  position:sticky;top:0;z-index:2;height:28px;padding:0 6px;background:var(--sk-panel);
  box-shadow:inset 0 -1px 0 var(--border);color:var(--sk-subtle);font-weight:500;
  text-align:left;font-size:10px;letter-spacing:.02em;
}
.sk-table th.sk-th-sort{padding:0 2px}
.sk-sortbtn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px;border-radius:5px;color:var(--sk-subtle);font:inherit}
.sk-sortbtn:hover{background:var(--sk-hover);color:var(--fg)}
.sk-sortbtn svg{opacity:.4}
.sk-table th[aria-sort="ascending"] .sk-sortbtn,.sk-table th[aria-sort="descending"] .sk-sortbtn{color:var(--sk-fg)}
.sk-table th[aria-sort="ascending"] .sk-sortbtn svg,.sk-table th[aria-sort="descending"] .sk-sortbtn svg{opacity:1;color:var(--sk-accent)}
.sk-col-check{width:26px}
.sk-col-source{width:50px}
.sk-col-usage{width:40px}
.sk-col-recent{width:78px}
.sk-col-scope{width:66px}
.sk-table tbody tr.sk-row{height:32px}
.sk-table tbody tr.sk-row:hover td{background:var(--sk-hover)}
.sk-row td{
  padding:0 6px;background:var(--sk-panel);box-shadow:inset 0 -1px 0 var(--border);
  color:var(--sk-muted);vertical-align:middle;white-space:nowrap;
}
.sk-row[data-expanded="true"] .sk-chevron{transform:rotate(180deg)}
.sk-row.sk-selected td{background:var(--sk-selected)}
.sk-row.sk-selected td:first-child{box-shadow:inset 2px 0 0 var(--sk-accent),inset 0 -1px 0 var(--border)}
.sk-row-name{display:flex;align-items:center;gap:6px;min-width:0}
.sk-row-bar{flex:none;width:2px;height:12px;border-radius:1px;background:var(--sk-success)}
.sk-row.sk-off .sk-row-bar{background:var(--sk-subtle)}
.sk-row.sk-anomaly .sk-row-bar{background:var(--sk-warn)}
.sk-row-open{display:flex;align-items:center;gap:6px;min-width:0;text-align:left;color:var(--sk-fg)}
.sk-row-open .sk-name{font-size:11px;font-weight:500}
.sk-row-open .sk-chevron{opacity:.55}
.sk-table .sk-badge{height:14px;font-size:9px}
.sk-th-scope{text-align:center}
.sk-scope-cell{display:flex;align-items:center;justify-content:center;gap:4px}
.sk-detail-row td{padding:0 8px 10px;background:var(--sk-surface);box-shadow:inset 0 -1px 0 var(--border)}
.sk-detail-row .sk-detail{margin-top:8px;padding-top:8px}
.sk-detail-row .sk-inline-error{margin-bottom:8px}

/* ---------- 批量操作条 ---------- */
.sk-action{
  flex:none;height:76px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:9px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--sk-accent);
  animation:sk-fade .18s ease-out both;
}
.sk-action-info{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--sk-muted);min-width:0}
.sk-action-info > svg{color:var(--sk-accent)}
.sk-action-info b{font-size:14px;font-weight:600;color:var(--sk-fg-strong);font-variant-numeric:tabular-nums}
.sk-action-note{font-size:10px;color:var(--sk-subtle)}
.sk-action-btns{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.sk-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;
  background:var(--sk-surface-2);box-shadow:inset 0 0 0 1px var(--sk-border-strong);
  color:var(--sk-fg);font-size:11px;white-space:nowrap;
}
.sk-btn:hover{background:var(--sk-surface-3)}
.sk-btn:disabled{opacity:.4;cursor:not-allowed}
.sk-btn--primary{background:var(--sk-accent);color:var(--sk-on-accent);box-shadow:none}
.sk-btn--primary:hover{background:var(--sk-accent-strong)}
.sk-btn--ghost{background:none;box-shadow:none;color:var(--sk-muted)}
.sk-btn--ghost:hover{background:var(--sk-hover);color:var(--fg)}
.sk-btn--danger{background:var(--sk-danger);color:var(--sk-on-danger);box-shadow:none}
.sk-btn--danger-ghost{background:none;box-shadow:inset 0 0 0 1px var(--sk-danger);color:var(--sk-danger)}
.sk-btn--danger-ghost:hover{background:var(--sk-danger-soft)}
.sk-action--confirm{background:var(--sk-danger-soft);box-shadow:inset 0 0 0 1px var(--sk-danger)}
.sk-action--confirm > svg{color:var(--sk-danger)}
.sk-action--confirm .sk-action-info{color:var(--sk-fg)}
.sk-action--confirm .sk-action-info em{font-style:normal;color:var(--sk-subtle);font-size:10px}

/* ---------- 状态页：空 / 错 / 加载 ---------- */
.sk-statearea{
  flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--sk-scroll) var(--sk-panel);
}
.sk-empty,.sk-error{
  flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px;text-align:center;
}
.sk-empty > svg{margin-bottom:10px;color:var(--sk-subtle)}
.sk-error > svg{margin-bottom:10px;color:var(--sk-danger)}
.sk-empty h2,.sk-error h2{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--sk-fg-strong)}
.sk-empty p,.sk-error p{margin:0;max-width:372px;font-size:11.5px;line-height:1.6;color:var(--sk-muted)}
.sk-error p code{font-size:10.5px;color:var(--sk-warn);word-break:break-all}
.sk-empty-actions{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.sk-empty-preview{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 10px;border-radius:8px;
  background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);font-size:10.5px;color:var(--sk-muted);
}
.sk-demo-switch{
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  width:100%;max-width:430px;margin-top:22px;padding-top:14px;
  box-shadow:inset 0 1px 0 var(--border);font-size:10px;color:var(--sk-subtle);
}
.sk-demo-switch > span{margin-right:2px}
.sk-demo-switch .sk-chip{height:22px;font-size:10px}
.sk-skeleton{display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.sk-skel-head{width:110px;height:10px;border-radius:4px;background:var(--sk-surface-3);animation:sk-pulse 1.4s ease-in-out infinite}
.sk-skel-card{
  height:72px;border-radius:10px;background:var(--sk-surface);box-shadow:inset 0 0 0 1px var(--border);
  padding:12px 14px;display:flex;flex-direction:column;gap:9px;animation:sk-pulse 1.4s ease-in-out infinite;
}
.sk-skel-line{height:8px;border-radius:4px;background:var(--sk-surface-3)}
.sk-skel-line.sk-w25{width:25%}.sk-skel-line.sk-w40{width:40%}.sk-skel-line.sk-w55{width:55%}.sk-skel-line.sk-w70{width:70%}

/* ---------- 诊断台 ---------- */
.sk-diag{flex:1;min-height:0;overflow:auto;padding:2px 2px 8px;scrollbar-width:thin;scrollbar-color:var(--sk-scroll) var(--sk-panel)}
.sk-diag-head{
  display:flex;align-items:center;gap:10px;padding:6px 2px 12px;margin-bottom:12px;
  box-shadow:inset 0 -1px 0 var(--border);
}
.sk-diag-title h2{margin:0;font-size:14px;font-weight:600;color:var(--sk-fg-strong)}
.sk-diag-title p{margin:2px 0 0;font-size:10.5px;color:var(--sk-subtle)}
.sk-diag-head .sk-btn{margin-left:auto}
.sk-diag-card{
  padding:12px;margin-bottom:10px;border-radius:10px;background:var(--sk-surface);
  box-shadow:inset 0 0 0 1px var(--border);
}
.sk-diag-card-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.sk-diag-card-head > svg{margin-top:1px;color:var(--sk-warn)}
.sk-diag-card-head h3{margin:0;font-size:12.5px;font-weight:600;color:var(--sk-fg-strong)}
.sk-diag-card-head p{margin:2px 0 0;font-size:10px;color:var(--sk-subtle)}
.sk-diag-card-head .sk-badge{margin-left:auto}
.sk-diag-meta{margin:0;display:flex;flex-direction:column;gap:7px}
.sk-diag-meta .sk-meta-row{grid-template-columns:38px 1fr;font-size:10.5px}
.sk-diag-meta .sk-meta-row dd{align-items:center}
.sk-diag-meta code{font-size:9.8px;color:var(--sk-muted);word-break:break-all}
.sk-diag-foot{margin-top:14px;font-size:10px;color:var(--sk-subtle);text-align:center}

/* ---------- Toast ---------- */
.sk-toast{
  position:absolute;left:50%;bottom:22px;z-index:80;transform:translateX(-50%) translateY(6px);
  display:flex;align-items:center;gap:7px;max-width:min(640px,calc(100% - 48px));padding:8px 12px;
  border-radius:8px;background:var(--sk-surface-3);
  box-shadow:0 12px 30px var(--sk-shadow-color),inset 0 0 0 1px var(--sk-border-strong);
  color:var(--sk-fg);font-size:11.5px;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;
}
.sk-toast.sk-on{opacity:1;transform:translateX(-50%) translateY(0)}
.sk-toast-dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--sk-accent)}
.sk-toast[data-kind="error"] .sk-toast-dot{background:var(--sk-danger)}
.sk-toast[data-kind="success"] .sk-toast-dot{background:var(--sk-success)}

/* ---------- 响应式 ---------- */
@media (max-width:1024px){
  .sk-stage{padding:20px}
  .sk-nav{width:64px;padding:10px 6px}
  .sk-nav-label{display:none}
  .sk-nav-item{justify-content:center;padding:0}
  .sk-nav-item span{display:none}
  .sk-nav-foot{justify-content:center;padding:8px 0 0}
  .sk-nav-foot div{display:none}
  .sk-content{padding:0 16px 14px}
  .sk-appfake{display:none}
}
@media (max-width:768px){
  .sk-canvas{width:100vw;height:100vh}
  .sk-stage{padding:0}
  .sk-panel{width:100%;height:100%;border-radius:0}
  .sk-nav{display:none}
  .sk-content{padding:0 12px 12px}
  .sk-crumb{display:none}
  .sk-detail{grid-template-columns:1fr}
  .sk-detail-col{padding-right:0}
  .sk-detail-col--right{padding-left:0;margin-top:9px;padding-top:9px;box-shadow:inset 0 1px 0 var(--border)}
  .sk-toolbar{height:auto;min-height:38px;flex-wrap:wrap;padding:4px 0}
  .sk-toolbar-right{margin-left:0;width:100%;justify-content:flex-end;flex-wrap:wrap}
  .sk-seg button span,.sk-select-btn span{display:none}
  .sk-stats-row{flex-wrap:wrap}
  .sk-stats{flex:none;width:100%}
  .sk-diag-entry{width:100%;justify-content:center}
  .sk-foot-note{display:none}
  .sk-win-title{display:none}
  .sk-action{height:auto;min-height:76px;flex-wrap:wrap;padding:10px 12px}
  .sk-action-btns{margin-left:0;width:100%;justify-content:flex-end}
}
@media (max-width:520px){
  .sk-filter-label{min-width:0}
  .sk-scan{padding:0 8px}
  .sk-stats .sk-stat span{display:none}
  .sk-group-provider{display:none}
  .sk-usage{font-size:9.5px}
  .sk-card{padding-left:13px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .sk-scan.sk-loading svg{animation:none}
  .sk-fade{animation:none}
}
</style>
</head>

<body>
<main class="sk-canvas" data-od-id="canvas-1440">
  <header class="sk-winbar" data-od-id="window-chrome">

    if (state.sortKey !== key) return icon('sortNeutral', 12);
    return icon(state.sortDir === 'asc' ? 'arrowUp' : 'arrowDown', 12);
  }

  function ariaSort(key) {
    if (state.sortKey !== key) return 'none';
    return state.sortDir === 'asc' ? 'ascending' : 'descending';
  }

  function sortHeader(key) {
    return '<button class="sk-sortbtn" type="button" data-sort="' + key + '" aria-label="按' + SORT_LABELS[key] + '排序">' +

  function rowHTML(s, showCheck) {
    var expanded = state.expanded.has(s.id);
    var cls = ['sk-row', 'sk-src-' + s.source];
    if (s.anomaly) cls.push('sk-anomaly');
    else if (!s.global) cls.push('sk-off');
    if (state.selected.has(s.id)) cls.push('sk-selected');

      ? '<tr class="sk-detail-row" role="row"><td colspan="' + cols + '">' + inlineErrorHTML(s) + '</td></tr>'

      '<button class="sk-row-open" type="button" data-action="toggle-detail" data-id="' + s.id + '" data-focus="open-' + s.id + '" aria-expanded="' + expanded + '" aria-controls="detail-row-' + s.id + '">' +
      '<span class="sk-name">' + esc(s.id) + '</span>' + badges + '<span class="sk-chevron">' + icon('chevron', 12) + '</span></button></div></td>' +

      '<td><div class="sk-scope-cell">' + scopeButtonMini(s, 'global') + scopeButtonMini(s, 'project') + '</div></td>' +
      '</tr>' + errorRow +
      '<tr class="sk-detail-row" id="detail-row-' + s.id + '" data-detail-for="' + s.id + '"' + (expanded ? '' : ' hidden') + '>' +

  function tableHTML(list) {
    var showCheck = state.selection;
    var head = '<tr>' +
      (showCheck ? '<th class="sk-col-check"><input type="checkbox" id="skSelectAll" aria-label="选择当前视图全部技能"></th>' : '') +
      '<th class="sk-th-sort" aria-sort="' + ariaSort('name') + '">' + sortHeader('name') + '</th>' +
      '<th class="sk-th-sort" aria-sort="' + ariaSort('source') + '">' + sortHeader('source') + '</th>' +
      '<th class="sk-th-sort" aria-sort="' + ariaSort('usage') + '">' + sortHeader('usage') + '</th>' +
      '<th class="sk-th-sort" aria-sort="' + ariaSort('recent') + '">' + sortHeader('recent') + '</th>' +

  function cardsHTML(list) {
    return ['project', 'user', 'bundled', 'anomaly'].map(function (key) {
      var items = list.filter(function (s) { return s.source === key; });

        '<span class="sk-group-count">' + items.length + '</span>' +

        '<div class="sk-group-body">' + items.map(cardHTML).join('') + '</div>' +

  function actionBarHTML() {
    var sel = Array.from(state.selected).map(function (id) { return BY_ID[id]; }).filter(Boolean);

        '<button class="sk-chip" type="button" data-empty="noresult" aria-pressed="' + (state.emptyVariant === 'noresult') + '">搜索无结果</button>' +

          '<span class="sk-badge sk-badge--warn">未收录</span></div>' +
          '<dl class="sk-diag-meta">' +
          '<div class="sk-meta-row"><dt>路径</dt><dd><code>' + esc(s.path) + '</code>' +
          '<button class="sk-icon-btn sk-icon-btn--sm" type="button" data-action="copy-path" data-id="' + s.id + '" aria-label="复制 ' + esc(s.id) + ' 的路径">' + icon('copy', 13) + '</button></dd></div>' +
          '<div class="sk-meta-row"><dt>原因</dt><dd>' + esc(s.anomaly.reason) + '</dd></div>' +
          '<div class="sk-meta-row"><dt>建议</dt><dd>' + esc(s.anomaly.suggestion) + '</dd></div>' +

      }).join('') +
      '<p class="sk-diag-foot">扫描范围：本项目 · 用户 · 内置。修复目录后重新扫描即可恢复收纳。</p>' +

  /* ------------------------------------------------------------------
     渲染
     ------------------------------------------------------------------ */
  function syncSearch() {
    var input = el('skSearch');
    if (input && input.value !== state.query) input.value = state.query;
    var clear = el('skSearchClear');
    if (clear) clear.hidden = !state.query;
  }

  function updateChrome(counts, display, pending) {
    document.querySelectorAll('[data-count]').forEach(function (node) {
      var key = node.getAttribute('data-count');
      node.textContent = pending ? '—' : (display[key] == null ? counts[key] : display[key]);
    });

    var active = activeStat();
    document.querySelectorAll('.sk-stat').forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-stat') === active));
    });
    document.querySelectorAll('#skFilters [data-source]').forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-source') === state.source));
    });
    document.querySelectorAll('#skFilters [data-status]').forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-status') === state.status));
    });
    var unusedBtn = el('skUnused');
    if (unusedBtn) unusedBtn.setAttribute('aria-pressed', String(state.unused));

    var diagEntry = document.querySelector('.sk-diag-entry');
    if (diagEntry) diagEntry.setAttribute('aria-label', '打开异常诊断，当前 ' + display.anomaly + ' 项异常');

    syncSearch();

    var scan = el('skScan');
    if (scan) {
      scan.disabled = state.loading;
      scan.classList.toggle('sk-loading', state.loading);
    }
    var scanLabel = el('skScanLabel');
    if (scanLabel) scanLabel.textContent = state.loading ? '扫描中…' : '重新扫描';

    var visible = sortList(getVisible());
    var resultCount = (state.emptyDemo && state.emptyVariant === 'nodata') ? 0 : visible.length;
    var result = el('skResult');
    if (result) result.innerHTML = pending ? '<b>—</b> 项结果' : '<b>' + resultCount + '</b> 项结果';
    var scanTime = el('skScanTime');
    if (scanTime) scanTime.textContent = '上次扫描 ' + state.scanTime;

    var cardsBtn = el('skCardsBtn');
    var tableBtn = el('skTableBtn');
    if (cardsBtn) cardsBtn.setAttribute('aria-pressed', String(state.view === 'cards'));
    if (tableBtn) tableBtn.setAttribute('aria-pressed', String(state.view === 'table'));

    var sortLabel = el('skSortLabel');
    if (sortLabel) sortLabel.textContent = SORT_LABELS[state.sortKey];
    var sortDir = el('skSortDir');
    if (sortDir) {
      sortDir.innerHTML = icon(state.sortDir === 'asc' ? 'arrowUp' : 'arrowDown', 14);
      sortDir.setAttribute('aria-label', '切换排序方向（当前' + (state.sortDir === 'asc' ? '升序' : '降序') + '）');
    }
    document.querySelectorAll('#skSortMenu .sk-menu-item').forEach(function (item) {
      item.setAttribute('aria-checked', String(item.getAttribute('data-sort') === state.sortKey));
    });

    var selectBtn = el('skSelectBtn');
    if (selectBtn) {
      selectBtn.hidden = state.selection;
      selectBtn.setAttribute('aria-pressed', String(state.selection));
    }
    document.querySelectorAll('#skDemoMenu .sk-menu-item').forEach(function (item) {
      item.setAttribute('aria-checked', String(item.getAttribute('data-scenario') === state.scenario));
    });
  }

  function setStage(kind, html) {
    var list = el('skListWrap');
    var stateArea = el('skStateArea');
    if (!list || !stateArea) return;
    if (kind === 'list') {
      stateArea.hidden = true;
      stateArea.innerHTML = '';
      list.hidden = false;
      list.innerHTML = html;
    } else {
      list.hidden = true;
      list.innerHTML = '';
      stateArea.hidden = false;
      stateArea.innerHTML = html;
    }
  }

  function updateSelectAll() {
    var box = document.getElementById('skSelectAll');
    if (!box) return;
    var visible = sortList(getVisible());
    var picked = visible.filter(function (s) { return state.selected.has(s.id); }).length;
    box.checked = visible.length > 0 && picked === visible.length;
    box.indeterminate = picked > 0 && picked < visible.length;
  }

  function render(opts) {
    opts = opts || {};
    var counts = computeCounts();
    var display = {};
    Object.keys(counts).forEach(function (k) { display[k] = counts[k]; });
    if (state.emptyDemo && state.emptyVariant === 'nodata') {
      Object.keys(display).forEach(function (k) { display[k] = 0; });
    }
    if (!state.projectCtx) {
      var projectEnabled = SKILLS.filter(function (s) { return s.source === 'project' && !s.anomaly && s.global; }).length;
      var projectUnused = SKILLS.filter(function (s) { return s.source === 'project' && s.usage === 0; }).length;
      display.project = 0;
      display.all = Math.max(0, counts.all - counts.project);
      display.enabled = Math.max(0, counts.enabled - projectEnabled);
      display.unused = Math.max(0, counts.unused - projectUnused);
    }
    var pending = state.loading && !state.hasLoaded;

    updateChrome(counts, display, pending);

    var diag = state.diagnostics;
    var command = el('skCommand');
    var filters = el('skFilters');
    var toolbar = el('skToolbar');
    var actionBar = el('skActionBar');
    if (command) command.hidden = diag || state.selection;
    if (filters) filters.hidden = diag;
    if (toolbar) toolbar.hidden = diag;
    if (actionBar) {
      actionBar.hidden = !(state.selection && !diag);
      if (state.selection && !diag) actionBar.innerHTML = actionBarHTML();
    }

    var list = sortList(getVisible());
    if (diag) {
      setStage('state', diagHTML());
    } else if (state.loading) {
      setStage('state', skeletonHTML());
    } else if (state.error) {
      setStage('state', errorHTML());
    } else if (state.emptyDemo) {
      setStage('state', emptyHTML(state.emptyVariant, true));
    } else if (list.length === 0) {
      var kind = 'nodata';
      if (state.query.trim()) kind = 'noresult';
      else if (!state.projectCtx && state.source === 'project') kind = 'noproject';
      else if (state.source !== 'all' || state.status !== 'all' || state.unused) kind = 'filtered';
      setStage('state', emptyHTML(kind, false));
    } else if (state.view === 'cards') {
      setStage('list', cardsHTML(list));
    } else {
      setStage('list', tableHTML(list));
    }

    updateSelectAll();

    if (opts.focus) {
      requestAnimationFrame(function () {
        var target = document.querySelector(opts.focus);
        if (target) target.focus({ preventScroll: true });
      });
    }
  }

  function showToast(message, kind) {
    var toast = el('skToast');
    var msg = el('skToastMsg');
    if (!toast || !msg) return;
    msg.textContent = message;
    toast.setAttribute('data-kind', kind || 'default');
    toast.classList.add('sk-on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('sk-on'); }, 2400);
  }

  function copyText(text, label) {
    if (!text) {
      showToast('没有可复制的内容', 'error');
      return;
    }
    function done(ok) {
      showToast(ok ? '已复制' + label : '复制失败，请手动选择文本', ok ? 'success' : 'error');
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        ta.remove();
        done(!!ok);
      } catch (err) {
        done(false);
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
      } else {
        fallback();
      }
    } catch (err2) {
      fallback();
    }
  }

  function copyPath(id) {
    var s = BY_ID[id];
    if (s) copyText(s.path, '路径');
  }

  function copyMD(id) {
    var s = BY_ID[id];
    if (s) copyText(mdFull(s), 'SKILL.md 全文');
  }

  function setTheme(theme) {
    state.theme = theme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    var btn = el('skThemeBtn');
    if (btn) {
      btn.innerHTML = icon(state.theme === 'light' ? 'moon' : 'sun', 15);
      var label = state.theme === 'light' ? '切换到深色主题' : '切换到浅色主题';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }
  }

  /* ------------------------------------------------------------------
     交互动作
     ------------------------------------------------------------------ */
  function leaveEmptyDemo() {
    if (!state.emptyDemo) return;
    state.emptyDemo = false;
    if (state.emptyVariant === 'noproject') {
      state.projectCtx = true;
      state.source = 'all';
    }
    state.emptyVariant = 'nodata';
  }

  function applyStat(key) {
    leaveEmptyDemo();
    if (key === 'all') {
      state.source = 'all';
      state.status = 'all';
      state.unused = false;
    } else if (state.status === key && state.source === 'all') {
      state.status = 'all';
    } else {
      state.source = 'all';
      state.status = key;
      state.unused = false;
    }
    render();
  }

  function setView(view) {
    if (state.view === view) return;
    state.view = view;
    closeSortMenu();
    render({ focus: view === 'cards' ? '#skCardsBtn' : '#skTableBtn' });
  }

  function setSort(key) {
    leaveEmptyDemo();
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = SORT_DEFAULT_DIR[key];
    }
    closeSortMenu();
    render({ focus: '#skSortBtn' });
  }

  function toggleDetail(id) {
    if (state.expanded.has(id)) state.expanded.delete(id);
    else state.expanded.add(id);
    render({ focus: '[data-focus="open-' + id + '"]' });
  }

  function toggleScope(id, scope) {
    var s = BY_ID[id];
    if (!s || s.anomaly) return;
    if (scope === 'project' && !state.projectCtx) {
      showToast('未绑定项目，本项目作用域不可用', 'error');
      return;
    }
    if (s.failPending) {
      s.failPending = false;
      state.inlineError = {
        id: id,
        scope: scope,
        msg: '无法写入启用配置：EACCES permission denied（项目技能配置只读）。'
      };
      render({ focus: '[data-focus="retry-' + id + '"]' });
      showToast('更新失败 · 可在行内重试', 'error');
      return;
    }
    s[scope] = !s[scope];
    state.inlineError = null;
    render({ focus: '[data-focus="sw-' + id + '-' + scope + '"]' });
    showToast((s[scope] ? '已启用' : '已禁用') + '「' + id + '」 · ' + (scope === 'global' ? '全局' : '本项目'), s[scope] ? 'success' : 'default');
  }

  function retryInlineError(id) {
    var err = state.inlineError;
    if (!err || err.id !== id) return;
    var s = BY_ID[id];
    if (!s) return;
    s[err.scope] = !s[err.scope];
    var wasOn = s[err.scope];
    state.inlineError = null;
    render({ focus: '[data-focus="sw-' + id + '-' + err.scope + '"]' });
    showToast('重试成功 · 已' + (wasOn ? '启用' : '禁用') + '「' + id + '」的' + (err.scope === 'global' ? '全局' : '本项目') + '作用域', 'success');
  }

  function enterSelection() {
    state.selection = true;
    state.selected.clear();
    state.batchConfirm = false;
    render({ focus: '[data-focus="batch-exit"]' });
  }

  function exitSelection() {
    state.selection = false;
    state.selected.clear();
    state.batchConfirm = false;
    render({ focus: '#skSelectBtn' });
  }

  function batchApply(enable) {
    var picked = Array.from(state.selected).map(function (id) { return BY_ID[id]; }).filter(Boolean);
    var eligible = picked.filter(function (s) { return !s.anomaly; });
    if (!eligible.length) {
      state.batchConfirm = false;
      showToast('所选项目没有可切换的普通技能', 'error');
      render();
      return;
    }
    eligible.forEach(function (s) { s.global = enable; s.project = enable; });
    state.inlineError = null;
    state.selection = false;
    state.selected.clear();
    state.batchConfirm = false;
    render({ focus: '#skSelectBtn' });
    showToast('已' + (enable ? '启用' : '禁用') + ' ' + eligible.length + ' 项' + (picked.length > eligible.length ? ' · 跳过 ' + (picked.length - eligible.length) + ' 项异常' : ''), enable ? 'success' : 'default');
  }

  function openDiag() {
    state.diagnostics = true;
    state.selection = false;
    state.selected.clear();
    state.batchConfirm = false;
    closeSortMenu();
    closeDemoMenu();
    render({ focus: '[data-action="close-diag"]' });
  }

  function closeDiag() {
    state.diagnostics = false;
    render({ focus: '[data-action="open-diag"]' });
  }

  function resetFilters() {
    state.emptyDemo = false;
    state.emptyVariant = 'nodata';
    state.projectCtx = true;
    state.query = '';
    state.source = 'all';
    state.status = 'all';
    state.unused = false;
    syncSearch();
    render({ focus: '#skSearch' });
  }

  function applyEmptyVariant(variant) {
    state.emptyDemo = true;
    state.emptyVariant = variant;
    state.error = false;
    state.loading = false;
    state.diagnostics = false;
    state.selection = false;
    state.batchConfirm = false;
    state.selected.clear();
    state.inlineError = null;
    state.query = '';
    state.source = 'all';
    state.status = 'all';
    state.unused = false;
    state.projectCtx = true;
    if (variant === 'noresult') state.query = 'kubernetes-operator';
    if (variant === 'noproject') {
      state.projectCtx = false;
      state.source = 'project';
    }
    syncSearch();
    render();
  }

  function startScan() {
    if (scanTimer) clearTimeout(scanTimer);
    state.loading = true;
    state.error = false;
    state.diagnostics = false;
    state.emptyDemo = false;
    state.emptyVariant = 'nodata';
    state.projectCtx = true;
    state.selection = false;
    state.batchConfirm = false;
    state.selected.clear();
    state.inlineError = null;
    render();
    scanTimer = setTimeout(function () {
      state.loading = false;
      state.hasLoaded = true;
      state.scanTime = nowHM();
      render();
      showToast('扫描完成 · ' + SKILLS.length + ' 项，' + computeCounts().anomaly + ' 项异常', 'success');
    }, 900);
  }

  function applyScenario(name) {
    closeDemoMenu();
    closeSortMenu();
    if (scanTimer) {
      clearTimeout(scanTimer);
      scanTimer = null;
    }
    resetSkillData();
    state.scenario = name;
    state.loading = false;
    state.hasLoaded = true;
    state.error = false;
    state.diagnostics = false;
    state.selection = false;
    state.batchConfirm = false;
    state.selected.clear();
    state.expanded.clear();
    state.inlineError = null;
    state.emptyDemo = false;
    state.emptyVariant = 'nodata';
    state.projectCtx = true;
    state.query = '';
    state.source = 'all';
    state.status = 'all';
    state.unused = false;
    state.view = 'cards';
    state.sortKey = 'name';
    state.sortDir = 'asc';

    if (name === 'search') {
      state.query = 'plugin';
    } else if (name === 'batch') {
      state.selection = true;
      ['development-lifecycle', 'dsh-plugin-development', 'plugin-test'].forEach(function (id) {
        state.selected.add(id);
      });
    } else if (name === 'diag') {
      state.diagnostics = true;
    } else if (name === 'empty') {
      state.emptyDemo = true;
      state.emptyVariant = 'nodata';
    } else if (name === 'error') {
      state.error = true;
    }
    syncSearch();
    setFade();
    render();
    if (name === 'batch') {
      requestAnimationFrame(function () {
        var exitBtn = document.querySelector('[data-focus="batch-exit"]');
        if (exitBtn) exitBtn.focus({ preventScroll: true });
      });
    }
  }

  function resetSkillData() {
    SKILLS.forEach(function (s) {
      s.global = s.baseGlobal;
      s.project = s.baseProject;
      s.failPending = s.baseFailPending;
    });
  }

  function setFade() {
    var view = el('skView');
    if (!view) return;
    view.classList.remove('sk-fade');
    void view.offsetWidth;
    view.classList.add('sk-fade');
  }

  function focusSearch() {
    closeDemoMenu();
    closeSortMenu();
    if (state.diagnostics) state.diagnostics = false;
    if (state.selection) {
      state.selection = false;
      state.selected.clear();
      state.batchConfirm = false;
    }
    render();
    var input = el('skSearch');
    if (input) {
      input.focus();
      input.select();
    }
  }

  /* ------------------------------------------------------------------
     键盘
     ------------------------------------------------------------------ */
  function handleEsc() {
    var demoMenu = el('skDemoMenu');
    var sortMenu = el('skSortMenu');
    if (demoMenu && !demoMenu.hidden) {
      closeDemoMenu();
      var demoBtn = el('skDemoBtn');
      if (demoBtn) demoBtn.focus({ preventScroll: true });
      return;
    }
    if (sortMenu && !sortMenu.hidden) {
      closeSortMenu();
      var sortBtn = el('skSortBtn');
      if (sortBtn) sortBtn.focus({ preventScroll: true });
      return;
    }
    if (state.batchConfirm) {
      state.batchConfirm = false;
      render({ focus: '[data-action="batch-disable"]' });
      return;
    }
    var search = el('skSearch');
    if (search && document.activeElement === search && state.query) {
      state.query = '';
      syncSearch();
      render();
      return;
    }
    if (state.selection) {
      exitSelection();
      return;
    }
    if (state.diagnostics) {
      closeDiag();
      return;
    }
    if (state.emptyDemo) {
      state.emptyDemo = false;
      state.projectCtx = true;
      state.query = '';
      syncSearch();
      render();
      return;
    }
    if (state.query) {
      state.query = '';
      syncSearch();
      render();
      return;
    }
    if (state.expanded.size) {
      state.expanded.clear();
      render();
    }
  }

  function onKeydown(e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      focusSearch();
      return;
    }
    if (e.key === 'Escape') handleEsc();
  }

  /* ------------------------------------------------------------------
     事件
     ------------------------------------------------------------------ */
  function handleAction(node) {
    var action = node.getAttribute('data-action');
    switch (action) {
      case 'rescan':
      case 'retry-scan':
        startScan();
        break;
      case 'clear-search':
        leaveEmptyDemo();
        state.query = '';
        syncSearch();
        render({ focus: '#skSearch' });
        break;
      case 'toggle-detail':
        toggleDetail(node.getAttribute('data-id'));
        break;
      case 'toggle-scope':
        toggleScope(node.getAttribute('data-id'), node.getAttribute('data-scope'));
        break;
      case 'retry-error':
        retryInlineError(node.getAttribute('data-id'));
        break;
      case 'copy-path':
        copyPath(node.getAttribute('data-id'));
        break;
      case 'copy-md':
        copyMD(node.getAttribute('data-id'));
        break;
      case 'open-diag':
        openDiag();
        break;
      case 'close-diag':
        closeDiag();
        break;
      case 'select-mode':
        enterSelection();
        break;
      case 'batch-exit':
        exitSelection();
        break;
      case 'batch-enable':
        batchApply(true);
        break;
      case 'batch-disable':
        state.batchConfirm = true;
        render({ focus: '[data-action="batch-confirm"]' });
        break;
      case 'batch-confirm':
        batchApply(false);
        break;
      case 'batch-cancel':
        state.batchConfirm = false;
        render({ focus: '[data-action="batch-disable"]' });
        break;
      case 'toggle-unused':
        leaveEmptyDemo();
        state.unused = !state.unused;
        render();
        break;
      case 'sort-dir':
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        render({ focus: '#skSortDir' });
        break;
      case 'toggle-sort-menu':
        toggleSortMenu();
        break;
      case 'reset-filters':
        resetFilters();
        break;
      case 'clear-search-all':
        state.emptyDemo = false;
        state.emptyVariant = 'nodata';
        state.projectCtx = true;
        state.query = '';
        state.source = 'all';
        state.status = 'all';
        state.unused = false;
        syncSearch();
        render({ focus: '#skSearch' });
        break;
      case 'select-project':
        showToast('原型演示：打开项目选择器');
        break;
      case 'open-all-sources':
        state.emptyDemo = false;
        state.projectCtx = true;
        state.source = 'all';
        state.status = 'all';
        state.unused = false;
        render();
        break;
      case 'close-panel':
        showToast('原型演示：关闭设置面板');
        break;
      case 'nav':
        showToast('原型仅演示「插件 → Skill 管理」');
        break;
      default:
        break;
    }
  }

  function onViewClick(e) {
    var target = e.target;

    var actionEl = target.closest('[data-action]');
    if (actionEl) {
      handleAction(actionEl);
      return;
    }
    var statEl = target.closest('[data-stat]');
    if (statEl) {
      applyStat(statEl.getAttribute('data-stat'));
      return;
    }
    var sourceEl = target.closest('#skFilters [data-source]');
    if (sourceEl) {
      leaveEmptyDemo();
      state.source = sourceEl.getAttribute('data-source');
      render();
      return;
    }
    var statusEl = target.closest('#skFilters [data-status]');
    if (statusEl) {
      leaveEmptyDemo();
      state.status = statusEl.getAttribute('data-status');
      render();
      return;
    }
    var viewEl = target.closest('[data-view]');
    if (viewEl) {
      setView(viewEl.getAttribute('data-view'));
      return;
    }
    var sortEl = target.closest('[data-sort]');
    if (sortEl) {
      setSort(sortEl.getAttribute('data-sort'));
      return;
    }
    var emptyEl = target.closest('[data-empty]');
    if (emptyEl) {
      applyEmptyVariant(emptyEl.getAttribute('data-empty'));
      return;
    }
    var tabEl = target.closest('[data-tab]');
    if (tabEl) {
      if (tabEl.getAttribute('data-tab') !== 'skills') showToast('原型仅演示「Skill 管理」页签');
      return;
    }

    var row = target.closest('tr.sk-row');
    if (row && !target.closest('button,input,a,label,pre,code,.sk-detail,.sk-inline-error')) {
      toggleDetail(row.getAttribute('data-row-id'));
      return;
    }
    var card = target.closest('.sk-card');
    if (card && !target.closest('button,input,a,label,pre,code,.sk-detail,.sk-inline-error')) {
      toggleDetail(card.getAttribute('data-id'));
    }
  }

  function onViewChange(e) {
    var box = e.target.closest('input[data-select]');
    if (box) {
      var id = box.getAttribute('data-select');
      if (box.checked) state.selected.add(id);
      else state.selected.delete(id);
      state.batchConfirm = false;
      render({ focus: '[data-focus="check-' + id + '"]' });
      return;
    }
    var all = e.target.closest('#skSelectAll');
    if (all) {
      var visible = sortList(getVisible()).map(function (s) { return s.id; });
      visible.forEach(function (sid) {
        if (all.checked) state.selected.add(sid);
        else state.selected.delete(sid);
      });
      state.batchConfirm = false;
      render({ focus: '#skSelectAll' });
    }
  }

  function bindEvents() {
    var view = el('skView');
    view.addEventListener('click', onViewClick);
    view.addEventListener('change', onViewChange);
    view.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'skSearch') {
        var value = e.target.value;
        leaveEmptyDemo();
        state.emptyDemo = false;
        state.projectCtx = true;
        state.query = value;
        render();
      }
    });

    el('skDemoBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      toggleDemoMenu();
    });
    el('skDemoMenu').addEventListener('click', function (e) {
      var item = e.target.closest('[data-scenario]');
      if (!item) return;
      applyScenario(item.getAttribute('data-scenario'));
    });
    el('skThemeBtn').addEventListener('click', function () {
      setTheme(state.theme === 'dark' ? 'light' : 'dark');
    });

    document.querySelectorAll('.sk-nav-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.getAttribute('aria-current') === 'page') return;
        showToast('原型仅演示「插件 → Skill 管理」');
      });
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.sk-sortwrap')) closeSortMenu();
      if (!e.target.closest('.sk-demo-wrap')) closeDemoMenu();
    });
    document.addEventListener('keydown', onKeydown);
  }

  /* ------------------------------------------------------------------
     启动
     ------------------------------------------------------------------ */
  function init() {
    state.scanTime = nowHM();
    setTheme('dark');
    bindEvents();
    state.loading = false;
    state.hasLoaded = true;
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
