# dsh-my-observability bundle patch: inserts the plugin row into the profile roster.
# The row mounts the host half (agent event audit store + git tooling +
# diff review + resource watchdog) and the client half (resources panel +
# git panel). Install with:
#
#   git clone https://github.com/baosfeng/my-dsh-plugins.git
#   dsh plugin --profile web add link:<仓库路径>/plugins/dsh-my-observability
- insert:
    - id: observability
      name: 'dsh-my-observability'
