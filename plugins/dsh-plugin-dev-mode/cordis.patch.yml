# The `plugin-dev` agent preset: a lean DSH plugin development mode, declared as
# one `@deepseek-ai/dsh-agent-preset` row in this bundle's patch layer.
#
# Since DSH 0.1.7 a preset is a declaration row carried by a bundle patch, not a
# directory under `$DSH_HOME/.agent-presets/` — nothing reads that directory any
# more. Install this bundle through `plugin_manager` (`install_bundle`, target =
# this directory); the Loader row id is `preset-<id>` by convention, so
# `preset-plugin-dev` here declares id `plugin-dev`.
#
# Everything needed to develop, debug, and ship DSH plugins: shell, filesystem,
# background jobs, goals, skills (the preset-authoring and plugin-development
# skills travel with `@deepseek-ai/dsh-agent-preset`), and the self-referential
# Cordis toolset (cordis_inspect_*/cordis_define/cordis_run/cordis_stop/
# cordis_undefine).
#
# Deliberately lighter than the shipped `cordis` preset, to keep the prompt
# cost down: plan mode, subagent/workflow/ralph delegation, and web search are
# absent here. Switch to the `standard` preset when those are needed.
#
# TRUST: the Cordis toolset evaluates model-written JavaScript against the
# live runtime, and a composition this agent writes becomes a preset other
# sessions mount. Treat a session on this preset as shell access.

- insert:
    - id: preset-plugin-dev
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: plugin-dev
        name: 插件开发模式
        description: 插件开发专用：具备 shell、文件编辑、后台任务、goal 与技能加载，并启用 Cordis 工具集（inspect/define/run/stop/undefine）。不含 plan mode、子代理/工作流与网页检索，prompt 开销更小。
        # `order` stays unset: the legacy `preset.yml` carried only name and
        # description, and the roster orders a preset without one by its own
        # rule. Setting a number here would invent a position the preset never
        # had.
        plugins:
          # ── identity ──────────────────────────────────────────────────────
          #
          # The preset's own persona, shadowing the deployment default for this
          # agent. `{{model}}` and `{{cwd}}` resolve from the agent's own route
          # and workspace. `@deepseek-ai/dsh-persona` takes `prefix`/`suffix`;
          # the former `text` key no longer exists, so the whole former persona
          # text becomes the prefix and no suffix is set.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

                This is the plugin development mode — the only preset that enables the Cordis toolset (cordis_inspect_* / cordis_define / cordis_run / cordis_stop / cordis_undefine). Use it to develop, debug, and maintain DSH plugins and to author dynamic Cordis Plugins.

                Load the `cordis-plugin-development` skill before creating or modifying a dynamic Plugin, and the `editing-cordis-compositions` skill before writing or changing an agent preset composition.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ─────────────────────────────────────────────────────────
          #
          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts`
          # injects it to publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row
          # that injects a service is the criterion for host-plane ownership —
          # injection resolves before any session exists, so there is no agent
          # to key by. Behind a preset realm those variables never reached the
          # model's shell at all. Both shell tools consume the host registry from
          # here; their executors (`bash-sandbox`/`pwsh-sandbox`) are host-plane
          # too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ────────────────────────────────────────────────────
          #
          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ───────────────────────────────────────────────
          #
          # Only the model-facing controls. The task REGISTRY stays on the host
          # plane: its producers sit outside any realm this file could put it in
          # — `tool-bash` above resolves it with `ctx.get`, and an entry-local
          # realm here is invisible to every sibling row, so `run_in_background`
          # would answer "background jobs unavailable" while these controls sat
          # in the catalog. The registry is keyed by owning agent anyway, so one
          # host instance serves every session. What a preset chooses is whether
          # its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── goals ─────────────────────────────────────────────────────────
          #
          # Only the model-facing tool. The goal SERVICE, its session driver, and
          # the `/goal` command stay on the host plane: the Gateway serves the
          # goal domain as Remote endpoints whose receiver comes from a generated
          # descriptor, so it resolves `goals` on the host and an entry-local
          # realm here would hide it. The registry is keyed by session anyway, so
          # one host instance serves every session. What a preset chooses is
          # whether its agent can call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ────────────────────────────────────────────────────
          #
          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
          # pruner must share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on
          # the HOST plane, and the rows here resolve that one instance. It takes
          # no configuration, keys every fold by Session, and owns the
          # context-meter projection units the browser reads for every session —
          # behind a realm those units would come and go with whichever presets
          # happen to be mounted. What a preset chooses is whether its agent
          # compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── skills ────────────────────────────────────────────────────────
          #
          # The skill REGISTRY lives in the host composition and is layered per
          # scope: these rows register into THIS preset's layer of it, so they
          # need no realm. `skill-filesystem` contributes local-root discovery
          # for agents on this preset, and `tool-skill` gives them the catalog
          # and loader; the merged catalog also carries whatever the deployment
          # registered globally (repository plugins).
          #
          # `customSkillDirs` resolves the skills shipped inside
          # `@deepseek-ai/dsh-agent-preset` rather than a directory beside this
          # file: a preset is a declaration row now, and `baseUrl` is that
          # package's own directory, so the authoring skills
          # (`editing-cordis-compositions`, `cordis-plugin-development`,
          # `cordis-composition-reference`) arrive with the host and can never
          # drift from the version that reads this preset. The expression is the
          # shipped `cordis` preset's, verbatim.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── remaining model-facing rows ───────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # ── Cordis toolset ────────────────────────────────────────────────
          #
          # The self-referential Cordis toolset: inspect the live runtime,
          # define, run, stop, and undefine dynamic Plugins. This preset enables
          # it — as does the shipped `cordis` preset; the difference here is the
          # slimmer tool mix above (no plan mode, delegation, or web search), so
          # prompt cost is lower. The toolset is a trust boundary, not a
          # sandbox — see this file's header.
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
