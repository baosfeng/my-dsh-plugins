# dsh-session-title-gen bundle patch: inserts the plugin row into the profile
# roster. The row mounts the server half (session/event listener + LLM title
# generation + session/title append) and the client half (the
# 「设置 → 插件 → 会话标题生成」settings tab for the 8 config keys below).
#
# 配置项（8 项）既可在 profile 的 cordis.patch.yml 的 config 下手写，也可在设置页
# 可视化编辑：设置页保存走 PUT /session-title-gen/api/config，写回**本行**（行 id
# `session-title-gen`）的 config 并热生效；写回前先合并本行已有键，不会删掉你手写的其它键。
# Install with:
#
#   git clone https://github.com/baosfeng/my-dsh-plugins.git
#   dsh plugin --profile web add link:<仓库路径>/plugins/dsh-session-title-gen
- insert:
    - id: session-title-gen
      name: 'dsh-session-title-gen'
